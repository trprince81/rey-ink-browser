name: Apply Rey Ink Command Center Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply command center composition
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="rey-ink-command-center"'
          if marker in s:
              print('Command center layout already installed.')
              raise SystemExit(0)

          css = r'''
          <style id="rey-ink-command-center">
          /* REY INK COMMAND CENTER — composition layer only. No data, IDs, JS, API or handlers changed. */
          :root{
            --cc-bg:#03040a;--cc-panel:#090b13;--cc-panel-hi:#0d101a;--cc-line:#252a40;
            --cc-v:#9d5cff;--cc-vhi:#c18aff;--cc-cyan:#67ddff;--cc-green:#42efb0;
            --cc-orange:#ffbf55;--cc-red:#ff5f83;--cc-white:#f8f7ff;--cc-muted:#78819b;
          }
          html,body{background:#03040a!important}
          body{
            background:
              radial-gradient(900px 600px at 72% -5%,#8a40ff18,transparent 64%),
              radial-gradient(650px 520px at 12% 52%,#145d8410,transparent 68%),
              radial-gradient(700px 500px at 90% 90%,#6929a70b,transparent 70%),#03040a!important;
          }
          body:before{opacity:.16!important;background-image:linear-gradient(#8f62ff0a 1px,transparent 1px),linear-gradient(90deg,#8f62ff0a 1px,transparent 1px)!important;background-size:56px 56px!important}
          .wrap{width:min(1640px,97vw)!important;margin:12px auto 42px!important}
          .head{
            height:70px!important;margin-bottom:12px!important;padding:10px 14px!important;border-radius:17px!important;
            background:linear-gradient(90deg,#080a11f7,#0a0c14e8 58%,#080a11f7)!important;
            border-color:#1e2335!important;box-shadow:0 18px 55px #00000055,inset 0 1px #ffffff07!important;
          }
          .brand{font-size:21px!important;letter-spacing:.4px!important}
          .brand:before{width:36px!important;height:36px!important;border-radius:10px!important;vertical-align:-10px!important}
          .hero{
            display:grid!important;grid-template-columns:218px minmax(0,1fr)!important;grid-template-rows:1fr!important;
            gap:0!important;padding:0!important;min-height:calc(100vh - 96px)!important;border-radius:23px!important;
            overflow:hidden!important;background:#05070d!important;border-color:#20253a!important;
            box-shadow:0 35px 110px #00000070,inset 0 1px #ffffff05!important;
          }
          .tabs{
            grid-column:1!important;grid-row:1!important;width:218px!important;height:100%!important;
            padding:17px 11px!important;margin:0!important;border:0!important;border-right:1px solid #1f2437!important;
            border-radius:0!important;background:linear-gradient(180deg,#090b13,#06080f 65%,#070811)!important;
            box-shadow:12px 0 45px #00000022!important;position:relative!important;z-index:5!important;
          }
          .tabs:after{
            content:"SECURE CONTROL\A LIVE WORKSPACE";white-space:pre;position:absolute;left:18px;bottom:18px;
            color:#505a73;font-size:8px;line-height:1.7;letter-spacing:1.8px;font-weight:900;
            padding-left:10px;border-left:1px solid #50317c;
          }
          .tabs:before{
            content:"REY INK\A CONTROL CENTER"!important;white-space:pre!important;display:block!important;
            margin:0 8px 22px!important;padding:4px 8px 17px!important;border-bottom:1px solid #1b2030!important;
            color:#d5cce4!important;font-size:11px!important;line-height:1.65!important;letter-spacing:2.4px!important;
          }
          .tab{
            min-height:44px!important;margin:2px 0!important;padding:11px 12px!important;border-radius:10px!important;
            font-size:12px!important;letter-spacing:.15px!important;color:#7d86a0!important;
          }
          .tab.active{
            background:linear-gradient(90deg,#371568,#1b122d 75%,#11101a)!important;
            border-color:#6e3aaa!important;box-shadow:inset 3px 0 #b978ff,0 8px 22px #7136aa17!important;
          }
          .section{
            grid-column:2!important;grid-row:1!important;min-width:0!important;height:100%!important;overflow:auto!important;
            padding:24px 28px 34px!important;background:linear-gradient(135deg,#070910,#05070d 55%,#08070e)!important;
          }
          .section h2{
            margin:0 0 20px!important;padding:0!important;font-size:29px!important;line-height:1.1!important;
            letter-spacing:-1px!important;display:flex!important;align-items:center!important;gap:12px!important;
          }
          .section h2:before{
            content:"";width:4px;height:29px;border-radius:4px;background:linear-gradient(#c18aff,#6d36d7);
            box-shadow:0 0 18px #a35dff55;display:inline-block;flex:0 0 auto;
          }
          .section h2:after{display:none!important}
          /* Dashboard becomes a real command-center composition instead of four equal cards. */
          #home .grid{
            display:grid!important;grid-template-columns:minmax(280px,1.55fr) repeat(3,minmax(155px,1fr))!important;
            grid-template-rows:auto auto!important;gap:12px!important;margin:0!important;
          }
          #home .grid .card:nth-child(1){grid-column:1 / span 2;grid-row:1 / span 2;min-height:196px!important;padding:24px!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important;background:radial-gradient(circle at 78% 20%,#8739ed13,transparent 34%),linear-gradient(145deg,#10101d,#070910)!important;border-color:#40305e!important}
          #home .grid .card:nth-child(1):after{right:18%;top:8%;width:150px;height:150px;background:radial-gradient(circle,#a55cff18 0,#a55cff08 25%,transparent 68%)!important;border:1px solid #a45cff13}
          #home .grid .card:nth-child(1):before{left:24px;width:110px!important}
          #home .grid .card:nth-child(1) .k{font-size:10px!important;letter-spacing:2px!important}
          #home .grid .card:nth-child(1) .v{font-size:64px!important;margin-top:13px!important;letter-spacing:-3px!important}
          #home .grid .card:nth-child(2){grid-column:3;grid-row:1;min-height:92px!important}
          #home .grid .card:nth-child(3){grid-column:4;grid-row:1;min-height:92px!important}
          #home .grid .card:nth-child(4){grid-column:3 / span 2;grid-row:2;min-height:92px!important}
          #home .grid .card:nth-child(4):before{background:linear-gradient(90deg,#ffb84d,transparent)!important;box-shadow:0 0 14px #ffb84d55!important}
          #home .grid .card:nth-child(2):before{background:linear-gradient(90deg,#66dfff,transparent)!important;box-shadow:0 0 14px #66dfff55!important}
          #home .grid .card:nth-child(3):before{background:linear-gradient(90deg,#43efb0,transparent)!important;box-shadow:0 0 14px #43efb055!important}
          #home .grid + #status{margin-top:12px!important}
          #status{min-height:48px!important;display:flex!important;align-items:center!important;font-size:12px!important;border-radius:12px!important;background:linear-gradient(90deg,#07100d,#080b12 35%,#080b12)!important;border-color:#20372f!important}
          #status:before{width:8px!important;height:8px!important;box-shadow:0 0 15px #42efb0!important}
          /* Make the bot/control region feel like a control surface. */
          #home .botCell,.botCell{min-width:0!important}
          .botBtns .btn{min-width:82px!important}
          .botCfg{background:#070910!important;border:1px solid #1f2436!important;border-radius:10px!important;padding:7px!important}
          /* All non-dashboard sections get a workspace frame and stronger hierarchy. */
          #clients .toolbar,#browsers .toolbar,#licenses .toolbar,#links .toolbar,#history .toolbar{margin-bottom:13px!important}
          #clients .table,#browsers .table,#licenses .table,#links .table{box-shadow:0 24px 65px #00000038!important}
          #clients .table tbody tr,#browsers .table tbody tr,#licenses .table tbody tr,#links .table tbody tr{height:64px!important}
          #clients .table td:first-child,#browsers .table td:first-child,#licenses .table td:first-child{font-weight:900!important;color:#eeeaff!important}
          #clients .table td:first-child:before,#browsers .table td:first-child:before,#licenses .table td:first-child:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;background:#9d5cff;box-shadow:0 0 10px #9d5cff77;vertical-align:middle}
          .table th{height:43px!important}
          .table td{height:60px!important}
          .actions{gap:6px!important}
          .actions .btn{font-size:11px!important;padding:8px 10px!important}
          .detail{margin-top:14px!important}
          /* Give empty states a deliberate terminal-style presentation without inventing content. */
          .empty{min-height:150px!important;display:flex!important;align-items:center!important;justify-content:center!important;flex-direction:column!important;gap:8px!important;background:radial-gradient(circle,#9b5cff09,transparent 58%),#070910!important}
          .history{min-height:280px!important}
          /* restrained motion: panels lift, not everything glows */
          .card,.table,.detail,.pair{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease!important}
          .card:hover{transform:translateY(-3px)!important}
          @media(max-width:1100px){
            .hero{grid-template-columns:190px minmax(0,1fr)!important}
            .tabs{width:190px!important}
            #home .grid{grid-template-columns:1.4fr 1fr 1fr!important}
            #home .grid .card:nth-child(1){grid-column:1 / span 2!important}
            #home .grid .card:nth-child(2){grid-column:3!important}
            #home .grid .card:nth-child(3){grid-column:3!important;grid-row:2!important}
            #home .grid .card:nth-child(4){grid-column:1 / span 2!important;grid-row:3!important}
          }
          @media(max-width:760px){
            .wrap{width:96vw!important}.head{height:auto!important}.hero{display:block!important;min-height:auto!important}
            .tabs{width:100%!important;height:auto!important;display:grid!important;grid-template-columns:repeat(2,1fr)!important;border-right:0!important;border-bottom:1px solid #1f2437!important;padding:10px!important}
            .tabs:before{grid-column:1/-1!important;margin-bottom:6px!important}.tabs:after{display:none!important}
            .section{height:auto!important;overflow:visible!important;padding:18px 14px 28px!important}
            #home .grid{grid-template-columns:1fr 1fr!important}
            #home .grid .card:nth-child(1){grid-column:1 / -1!important;grid-row:auto!important;min-height:165px!important}
            #home .grid .card:nth-child(2),#home .grid .card:nth-child(3),#home .grid .card:nth-child(4){grid-column:auto!important;grid-row:auto!important}
          }
          @media(max-width:520px){
            .tabs{grid-template-columns:1fr!important}.section{padding:15px 10px 24px!important}
            #home .grid{grid-template-columns:1fr!important}
            #home .grid .card:nth-child(1),#home .grid .card:nth-child(2),#home .grid .card:nth-child(3),#home .grid .card:nth-child(4){grid-column:1!important}
          }
          </style>
          '''
          if '</head>' not in s:
              raise SystemExit('index.html has no </head> marker')
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Command center composition installed.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "style: make Rey Ink Control Center a command workspace"
          git push
