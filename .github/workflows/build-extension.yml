name: Build Rey Ink extension
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension files
        run: |
          test -f extension/manifest.json
          node --check extension/background.js
          node --check extension/bootstrap.js
          node --check extension/capture_bridge.js
          node --check extension/control.js
          node --check extension/offscreen.js
          test -f extension/control.html
          test -f extension/offscreen.html
          test -f extension/icons/icon128.png
      - name: Package extension
        run: |
          cd extension
          zip -qr ../Rey_Ink_4.8.8_REAL.zip .
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: Rey_Ink_4.8.8_REAL
          path: Rey_Ink_4.8.8_REAL.zip
