name: Inject Mutant module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-mutant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Mutant module
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          marker = 'id="mutant-panel-injected"'
          if marker in html:
              print('Mutant module already injected; nothing to do.')
              raise SystemExit(0)

          injection = r'''<style id="mutant-panel-injected">
          #mutantTab{color:#39efad;border-color:#173d32;background:linear-gradient(90deg,#0c241d,#0b1714)}
          #mutantTab:hover{color:#7dffc9;background:linear-gradient(90deg,#10352a,#0d211b);box-shadow:0 0 24px #28e69c18}
          #mutantPanel{display:none;grid-column:2;grid-row:1;min-width:0;padding:8px 8px 18px}
          #mutantPanel.active{display:block}
          #mutantFrame{width:100%;height:680px;border:1px solid #1f3d32;border-radius:18px;background:#030a08;box-shadow:0 18px 50px #0008}
          @media(max-width:720px){#mutantPanel{padding:6px}#mutantFrame{height:760px}}
          </style>
          <script id="mutant-panel-script">
          (()=>{
            const boot=()=>{
              const tabs=document.querySelector('.tabs');
              const hero=document.querySelector('.hero');
              if(!tabs||!hero||document.getElementById('mutantTab')) return;
              const tab=document.createElement('button');
              tab.type='button';tab.id='mutantTab';tab.className='tab';tab.textContent='MUTANT';
              tab.title='Centro de control de licencias y límites de Mutant';
              tabs.appendChild(tab);
              const panel=document.createElement('section');
              panel.id='mutantPanel';panel.className='section';
              panel.innerHTML='<h2>MUTANT</h2><div class="notice">Licencias, perfiles y límites de Mutant.</div><iframe id="mutantFrame" title="Mutant Control Center" src="/mutant.html"></iframe>';
              hero.appendChild(panel);
              const hide=()=>{panel.classList.remove('active');tab.classList.remove('active');};
              const show=()=>{
                document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
                document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
                panel.classList.add('active');tab.classList.add('active');
              };
              tab.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();show();},true);
              document.addEventListener('click',e=>{
                const t=e.target.closest?.('.tab');
                if(t&&t!==tab) hide();
              },true);
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
          })();
          </script>'''

          html = html.replace('</body>', injection + '\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          print('Mutant module injected into index.html')
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Mutant module to Rey Ink Control Center"
          git push
