name: Wire Rey Ink reference UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject reference assets and admin bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'reference-ui.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/reference-ui.css?v=4">\n</head>')
          if 'reference-ui-stability.js' not in s:
              marker='<script src="/reference-ui.js?v=4"></script>'
              if marker in s:
                  s=s.replace(marker,'<script src="/reference-ui-stability.js?v=1"></script>\n'+marker,1)
              else:
                  s=s.replace('</body>','<script src="/reference-ui-stability.js?v=1"></script>\n</body>')
          if 'reference-ui.js' not in s:
              s=s.replace('</body>','<script src="/reference-ui-stability.js?v=1"></script>\n<script src="/reference-ui.js?v=4"></script>\n</body>')
          if 'reference-ui-link-fix.js' not in s:
              s=s.replace('</body>','<script src="/reference-ui-link-fix.js?v=1"></script>\n</body>')
          if 'link-admin.js' not in s:
              s=s.replace('</body>','<script src="/link-admin.js?v=1"></script>\n</body>')
          if 'link-admin-pro.js' not in s:
              s=s.replace('</body>','<script src="/link-admin-pro.js?v=1"></script>\n</body>')
          if 'client-detail-links.js' not in s:
              s=s.replace('</body>','<script src="/client-detail-links.js?v=1"></script>\n</body>')
          if 'client-detail-links.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/client-detail-links.css?v=1">\n</head>')
          if 'activity-manager.js' not in s:
              s=s.replace('</body>','<script src="/activity-manager.js?v=1"></script>\n</body>')
          if 'activity-manager.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/activity-manager.css?v=1">\n</head>')
          if 'window.__RI_ADMIN' not in s:
              marker='const ADMIN='
              pos=s.find(marker)
              end=s.find('</script>',pos)
              if pos>=0 and end>=0:
                  bridge='\nwindow.__RI_ADMIN={api:api,action:action,refresh:refresh};\n'
                  s=s[:end]+bridge+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Already wired"; exit 0; fi
          git commit -m "fix: wire stable link actions"
          git push
