name: Wire Rey Ink reference UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject reference assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='reference-ui.css'
          if marker not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/reference-ui.css?v=3">\n</head>')
          if 'reference-ui.js' not in s:
              s=s.replace('</body>','<script src="/reference-ui.js?v=3"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Already wired"; exit 0; fi
          git commit -m "ui: wire reference dashboard assets"
          git push