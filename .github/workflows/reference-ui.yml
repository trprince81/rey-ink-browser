name: Wire Rey Ink reference UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject reference assets and database RPC bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # The Edge Function was returning HTTP 402 after the project hit its
          # function-invocation restriction. Keep the UI on Supabase, but use
          # a security-definer Postgres RPC instead of any Edge Function.
          s=s.replace(
              "const API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-control-center-v2';",
              "const API='https://rnduuuiskfuikzuepvnw.supabase.co/rest/v1/rpc/rey_ink_control_center';\nconst SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZHV1d2lza2Z1aWt6dWVwdm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTc5MjQsImV4cCI6MjEwMzQzMzkyNH0.1-FDsDgmlC8pzrcnRVo6UqSQmkvRihGps81ZSnlktRA';"
          )
          s=s.replace(
              "const API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-control-center-proxy';",
              "const API='https://rnduuuiskfuikzuepvnw.supabase.co/rest/v1/rpc/rey_ink_control_center';\nconst SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZHV1d2lza2Z1aWt6dWVwdm53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTc5MjQsImV4cCI6MjEwMzQzMzkyNH0.1-FDsDgmlC8pzrcnRVo6UqSQmkvRihGps81ZSnlktRA';"
          )

          # Replace the old REST/Edge-function client with one POST to the RPC.
          s=re.sub(
              r"async function api\(body=null,action=''\)\{.*?\}\nfunction deviceName",
              """async function api(body=null,action=''){
const a=action||body?.action||'get_data';
const payload=body?{...body}:{};
delete payload.action;
const r=await fetch(API,{method:'POST',headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON,'content-type':'application/json'},body:JSON.stringify({p_admin_key:ADMIN,p_action:a,p_payload:payload}),cache:'no-store'});
let j={};try{j=await r.json()}catch{}
if(!r.ok)throw Error(j.message||j.error||('HTTP '+r.status));
if(j?.error)throw Error(j.error);
return j}
function deviceName""",
              s,
              count=1,
              flags=re.S
          )

          def remove_asset(src):
              nonlocal_s[0]=re.sub(r'<script[^>]+src=["\']/'+re.escape(src)+r'(?:\?[^"\']*)?["\'][^>]*></script>\s*', '', nonlocal_s[0], flags=re.I)
          def remove_css(href):
              nonlocal_s[0]=re.sub(r'<link[^>]+href=["\']/'+re.escape(href)+r'(?:\?[^"\']*)?["\'][^>]*>\s*', '', nonlocal_s[0], flags=re.I)

          nonlocal_s=[s]
          for x in ['reference-ui.css','client-detail-links.css','activity-manager.css']:
              remove_css(x)
          s=nonlocal_s[0]
          s=s.replace('</head>',''.join([
              '<link rel="stylesheet" href="/reference-ui.css?v=6">\n',
              '<link rel="stylesheet" href="/client-detail-links.css?v=3">\n',
              '<link rel="stylesheet" href="/activity-manager.css?v=3">\n',
          ])+'</head>',1)

          nonlocal_s=[s]
          scripts=['reference-ui-stability.js','reference-ui.js','reference-ui-links-fix.js','link-admin.js','link-admin-pro.js','client-detail-links.js','activity-manager.js']
          for x in scripts:
              remove_asset(x)
          s=nonlocal_s[0]
          s=s.replace('</body>',''.join([f'<script src="/{x}?v=4"></script>\n' for x in scripts])+'</body>',1)

          # Load the Mutant/API bridge explicitly. It will still handle the
          # Mutant iframe, while the main Control Center now uses the RPC.
          nonlocal_s=[s]
          remove_asset('reference-ui-link-fix.js')
          s=nonlocal_s[0]
          s=s.replace('</body>','<script src="/reference-ui-link-fix.js?v=3"></script>\n</body>',1)

          if 'window.__RI_ADMIN' not in s:
              marker='const ADMIN='
              pos=s.find(marker)
              end=s.find('</script>',pos)
              if pos>=0 and end>=0:
                  s=s[:end]+'\nwindow.__RI_ADMIN={api:api,action:action,refresh:refresh};\n'+s[end:]

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Already wired"; exit 0; fi
          git commit -m "fix: use database RPC for control center"
          git push
