<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink — Acceso del cliente</title><style>:root{--bg:#05060b;--p:#0d101b;--line:#272b42;--v:#9b5cff;--g:#2ee6a6;--r:#ff5577;--mut:#9299b0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% -10%,#682ab03b,transparent 65%),#05060b;color:#f7f7ff;font:15px system-ui}.card{width:min(560px,92vw);padding:32px;border:1px solid var(--line);border-radius:24px;background:#0b0e18eF;box-shadow:0 20px 80px #0008}.logo{font-size:25px;font-weight:950}.logo span{color:var(--v)}.pill{display:inline-block;margin-top:18px;padding:6px 10px;border-radius:99px;background:#173a30;color:var(--g);font-size:12px;font-weight:900}.bad{background:#3a1721;color:#ff9bb0}.title{font-size:30px;font-weight:950;margin:14px 0 6px}.sub{color:var(--mut);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.item{padding:13px;border:1px solid var(--line);border-radius:14px;background:#080b13}.k{font-size:10px;color:var(--mut);text-transform:uppercase}.v{margin-top:5px;font-weight:850}.footer{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}.loading{text-align:center;color:var(--mut)}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:24px}}</style></head><body><main class="card"><div class="logo">👑 Rey <span>Ink</span></div><div id="app" class="loading">Validando acceso…</div></main><script>const API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const app=document.getElementById('app');const token=new URLSearchParams(location.search).get('d')||'';async function run(){if(!token){app.innerHTML='<span class="pill bad">LINK INVÁLIDO</span><div class="title">No hay código de acceso</div><div class="sub">Este enlace no contiene un identificador válido.</div>';return}try{const r=await fetch(API+'?token='+encodeURIComponent(token));const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'No se pudo validar el link.');if(x.link.active===false){app.innerHTML='<span class="pill bad">LINK REVOCADO</span><div class="title">Acceso desactivado</div><div class="sub">Este link ya no está activo. Solicita al administrador un nuevo enlace.</div>';return}const c=x.client,d=x.device,l=x.license;app.innerHTML='<span class="pill">LINK ACTIVO</span><div class="title">Bienvenido, '+esc(c?.name||x.link.label||'Cliente')+'</div><div class="sub">Este es tu acceso personal de Rey Ink. El enlace está asociado al navegador configurado por el administrador.</div><div class="grid"><div class="item"><div class="k">Navegador</div><div class="v">'+esc(d?.name||'No asignado')+'</div></div><div class="item"><div class="k">Estado</div><div class="v">'+(d?.is_online?'🟢 Conectado':'⚪ Desconectado')+'</div></div><div class="item"><div class="k">Licencia</div><div class="v">'+esc(l?.status||'Sin licencia')+'</div></div><div class="item"><div class="k">Vencimiento</div><div class="v">'+(l?.expires_at?esc(new Date(l.expires_at).toLocaleDateString()):'—')+'</div></div></div><div class="footer">Acceso generado por Rey Ink · Link individual del cliente</div>'}catch(e){app.innerHTML='<span class="pill bad">ERROR</span><div class="title">No se pudo validar</div><div class="sub">'+esc(e.message||'Error de conexión.')+'</div>'}}run();</script></body></html>
