<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rey Ink — Control remoto</title>
<style>
:root{--v:#a66bff;--g:#39efad;--r:#ff5577;--mut:#b0b5c8}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:#03040a!important;color:#f7f6ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{background-color:#03040a!important;background-attachment:fixed!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}.wrap{width:min(1040px,94vw);margin:auto;padding:28px 0 50px}.top{position:relative;display:flex;justify-content:center;align-items:center;min-height:76px;margin-bottom:18px}.brand{font-size:34px;font-weight:950;letter-spacing:3px;text-shadow:0 0 28px #9b5cff66}.brand span{color:var(--v)}.back{position:absolute;right:0;top:25px;color:#d5d8e5;text-decoration:none;border:1px solid #3c4054;border-radius:10px;padding:9px 12px;background:#080a12cc}.hero{border:1px solid #514a68;border-radius:24px;background:rgba(7,9,16,.58);box-shadow:0 24px 90px #000b,0 0 70px #7d43d214;backdrop-filter:blur(7px);padding:28px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#173a30dd;color:var(--g);font-size:11px;font-weight:950;letter-spacing:.6px}.bad{background:#3a1721dd;color:#ff9bb0}.title{font-size:32px;font-weight:950;margin:11px 0 6px}.muted{color:var(--mut);line-height:1.6}.state{margin:20px 0;padding:18px;border-radius:16px;border:1px solid #3b4055;background:rgba(5,8,14,.66)}.state b{font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.card{border:1px solid #3b4054;border-radius:16px;background:rgba(5,8,14,.66);padding:16px}.k{font-size:10px;color:#8d94aa;letter-spacing:1.1px;font-weight:800}.v{margin-top:7px;font-weight:950}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:17px}.btn{border:1px solid #4a5068;background:rgba(15,18,29,.92);color:#fff;border-radius:12px;padding:14px;font-weight:950;cursor:pointer}.start{background:linear-gradient(135deg,#39efad,#1ebd7c);color:#04110b;border:0}.stop{background:linear-gradient(135deg,#ff5577,#a92748);border:0}.config{background:linear-gradient(135deg,#a66bff,#6e32d8);border:0}.log{margin-top:15px;min-height:45px;padding:13px;border-radius:12px;background:rgba(5,8,14,.78);border:1px solid #343a50;color:#c0c5d5;font-size:12px}.spin{display:inline-block;width:10px;height:10px;border:2px solid #8f96aa;border-top-color:var(--v);border-radius:50%;animation:s .8s linear infinite;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}.top{justify-content:flex-start}.brand{font-size:28px}.back{position:static;margin-left:auto}.wrap{padding-top:10px}.hero{padding:20px}.title{font-size:26px}}
</style>
</head>
<body>
<main class="wrap"><div class="top"><div class="brand">REY <span>INK</span></div><a class="back" href="/">Control Center</a></div><section id="app" class="hero"><span class="pill"><span class="spin"></span>CONECTANDO</span><div class="title">Validando acceso…</div><div class="muted">Verificando el enlace seguro con el navegador asignado.</div></section></main>
<script src="/rey-ink-bg.js?v=20"></script>
<script>
(function(){'use strict';
var LINK_API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link';
var CMD_API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link-commands';
var p=new URLSearchParams(location.search),token=(p.get('d')||p.get('token')||'').trim(),deviceId='',app=document.getElementById('app');
function backgroundData(){try{var s=document.getElementById('ri-exact-bg');var m=s&&s.textContent.match(/body\{background-image:(url\(".*?"\))/);return m?m[1]:''}catch(_){return ''}}
function repairBackground(){var bg=backgroundData();if(!bg)return;try{document.body.style.setProperty('background-image',bg,'important');document.documentElement.style.setProperty('--ri-exact-image',bg)}catch(_){} }
function forceBackgroundLayer(){var bg=backgroundData();if(!bg)return;try{var layer=document.getElementById('ri-background-layer');if(!layer){layer=document.createElement('div');layer.id='ri-background-layer';document.body.insertBefore(layer,document.body.firstChild)}layer.style.cssText='position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:0!important;pointer-events:none!important;background-color:#03040a!important;background-image:'+bg+'!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;background-attachment:fixed!important';document.querySelectorAll('body > *:not(#ri-background-layer)').forEach(function(el){el.style.position='relative';el.style.zIndex='1'})}catch(_){} }
function installBackground(){repairBackground();forceBackgroundLayer();setTimeout(function(){repairBackground();forceBackgroundLayer()},100);setTimeout(function(){repairBackground();forceBackgroundLayer()},700)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(url,opt){opt=opt||{};var c=new AbortController(),timer=setTimeout(function(){c.abort()},12000);var sep=url.indexOf('?')>=0?'&':'?';return fetch(url+sep+'_ri='+Date.now(),{method:opt.method||'GET',headers:opt.headers||{},body:opt.body,cache:'no-store',credentials:'omit',signal:c.signal}).then(function(r){return r.text().then(function(t){var x;try{x=JSON.parse(t)}catch(_){throw Error('Respuesta inválida del servidor (HTTP '+r.status+').')}if(!r.ok||x.ok===false)throw Error(x.error||('HTTP '+r.status));return x})}).finally(function(){clearTimeout(timer)})}
function errorView(msg){app.innerHTML='<span class="pill bad">NO CONECTADO</span><div class="title">No se pudo validar el enlace</div><div class="muted">'+esc(msg)+'</div><button id="retry" class="btn config" style="margin-top:17px">↻ REINTENTAR</button>';document.getElementById('retry').onclick=load;installBackground()}
function load(){installBackground();if(!token){errorView('Falta el código de acceso del enlace.');return}app.innerHTML='<span class="pill"><span class="spin"></span>CONECTANDO</span><div class="title">Validando acceso…</div><div class="muted">Verificando el enlace seguro con el navegador asignado.</div>';api(LINK_API+'?token='+encodeURIComponent(token)).then(function(x){if(x.link&&x.link.active===false)throw Error('Este link está revocado.');deviceId=x.device&&x.device.id||'';if(!deviceId)throw Error('El enlace es válido, pero no tiene un navegador asignado.');render(x);return refresh()}).catch(function(e){errorView(e.name==='AbortError'?'El servidor tardó demasiado en responder.':e.message||'No se pudo conectar con el servidor.')})}
function render(x){var client=x.client&&x.client.name||x.link&&x.link.label||'Cliente',dev=x.device&&x.device.name||'Navegador',lic=x.license&&x.license.status||'Activa',exp=x.license&&x.license.expires_at?new Date(x.license.expires_at).toLocaleDateString():'—';app.innerHTML='<span class="pill">ACCESO REMOTO</span><div class="title">'+esc(client)+'</div><div class="muted">Control remoto del navegador asignado. No necesitas iniciar sesión en el Control Center.</div><div class="state"><div class="k">ESTADO DEL NAVEGADOR</div><div id="online" style="margin-top:7px"><b>Consultando…</b></div><div id="seen" class="muted" style="font-size:12px;margin-top:5px"></div></div><div class="grid"><div class="card"><div class="k">NAVEGADOR</div><div class="v">'+esc(dev)+'</div></div><div class="card"><div class="k">LICENCIA</div><div class="v">'+esc(lic)+'</div></div><div class="card"><div class="k">VENCIMIENTO</div><div class="v">'+esc(exp)+'</div></div></div><div class="actions"><button id="start" class="btn start">▶ INICIAR BOT</button><button id="stop" class="btn stop">■ DETENER BOT</button><button id="config" class="btn config">⚙ CONFIGURAR</button><button id="state" class="btn">◉ ACTUALIZAR ESTADO</button></div><div id="log" class="log">Conectado. Las órdenes se enviarán al navegador asignado.</div>';document.getElementById('start').onclick=function(){send('bot_start')};document.getElementById('stop').onclick=function(){send('bot_stop')};document.getElementById('config').onclick=configure;document.getElementById('state').onclick=function(){send('bot_state')};installBackground()}
function refresh(){if(!deviceId)return Promise.resolve();return api(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token)).then(function(x){var d=x.device||{},o=document.getElementById('online'),s=document.getElementById('seen');if(o)o.innerHTML='<b style="color:'+(d.is_online?'var(--g)':'var(--r)')+'">'+(d.is_online?'● CONECTADO':'● DESCONECTADO')+'</b>';if(s)s.textContent=d.last_seen_at?'Último contacto: '+new Date(d.last_seen_at).toLocaleString():'Sin contacto registrado'}).catch(function(){var o=document.getElementById('online');if(o)o.innerHTML='<b style="color:var(--r)">● REMOTO SIN RESPUESTA</b>'})}
function send(command,payload){var log=document.getElementById('log');if(!log)return;log.textContent='Enviando '+command+'…';api(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command:command,payload:payload||{}})}).then(function(x){var id=x.command&&x.command.id;if(!id)throw Error('El servidor no devolvió la orden.');var i=0;function poll(){if(++i>40)throw Error('El navegador no confirmó la orden a tiempo.');return new Promise(function(r){setTimeout(r,500)}).then(function(){return api(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token)+'&command_id='+encodeURIComponent(id))}).then(function(s){var st=s.command&&s.command.status;if(st==='completed'){log.textContent='✓ '+command+' ejecutado correctamente.';return refresh()}if(st==='failed'||st==='error')throw Error(s.command.error_message||'La extensión reportó un error.');return poll()})}return poll()}).catch(function(e){log.textContent='✕ '+(e.message||'Error al enviar la orden');refresh()})}
function configure(){var min=prompt('Intervalo mínimo en minutos:','15');if(min===null)return;var max=prompt('Intervalo máximo en minutos:',min);if(max===null)return;send('bot_config',{min:Number(min)||15,max:Number(max)||Number(min)||15})}
installBackground();load();setInterval(function(){installBackground();refresh()},5000);
window.addEventListener('error',function(e){if(app&&/Validando acceso/.test(app.innerText||''))errorView('Error de JavaScript: '+(e.message||'código de la página'))});
})();
</script>
</body>
</html>
