<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink — Control remoto</title><style>:root{--v:#a66bff;--g:#39efad;--r:#ff5577;--mut:#b0b5c8;--line:#4a4560}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:#03040a;color:#f7f6ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{background-color:#03040a;background-attachment:fixed;background-size:cover;background-position:center}.wrap{width:min(1040px,94vw);margin:0 auto;padding:28px 0 50px}.top{position:relative;display:flex;justify-content:center;align-items:center;min-height:76px;margin-bottom:18px}.brand{font-size:34px;font-weight:950;letter-spacing:3px;text-shadow:0 0 28px #9b5cff66}.brand span{color:var(--v)}.back{position:absolute;right:0;top:25px;color:#d5d8e5;text-decoration:none;border:1px solid #3c4054;border-radius:10px;padding:9px 12px;background:#080a12cc}.hero{border:1px solid #514a68;border-radius:24px;background:rgba(7,9,16,.64);box-shadow:0 24px 90px #000b,0 0 70px #7d43d214;backdrop-filter:blur(7px);padding:28px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#173a30dd;color:var(--g);font-size:11px;font-weight:950;letter-spacing:.6px}.bad{background:#3a1721dd;color:#ff9bb0}.title{font-size:32px;font-weight:950;margin:11px 0 6px;text-shadow:0 0 25px #000}.muted{color:var(--mut);line-height:1.6}.state{margin:20px 0;padding:18px;border-radius:16px;border:1px solid #3b4055;background:rgba(5,8,14,.72)}.state b{font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.card{border:1px solid #3b4054;border-radius:16px;background:rgba(5,8,14,.72);padding:16px}.k{font-size:10px;color:#8d94aa;letter-spacing:1.1px;font-weight:800}.v{margin-top:7px;font-weight:950}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:17px}.btn{border:1px solid #4a5068;background:rgba(15,18,29,.92);color:#fff;border-radius:12px;padding:14px;font-weight:950;cursor:pointer}.btn:hover{border-color:#8b57d5;transform:translateY(-1px)}.start{background:linear-gradient(135deg,#39efad,#1ebd7c);color:#04110b;border:0}.stop{background:linear-gradient(135deg,#ff5577,#a92748);border:0}.config{background:linear-gradient(135deg,#a66bff,#6e32d8);border:0}.log{margin-top:15px;min-height:45px;padding:13px;border-radius:12px;background:rgba(5,8,14,.82);border:1px solid #343a50;color:#c0c5d5;font-size:12px}.spin{display:inline-block;width:10px;height:10px;border:2px solid #8f96aa;border-top-color:var(--v);border-radius:50%;animation:s .8s linear infinite;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}.top{justify-content:flex-start;padding-right:0}.brand{font-size:28px}.back{position:static;margin-left:auto}.wrap{padding-top:10px}.hero{padding:20px}.title{font-size:26px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">REY <span>INK</span></div><a class="back" href="/">Control Center</a></div><section id="app" class="hero"><span class="pill"><span class="spin"></span>CONECTANDO</span><div class="title">Validando acceso…</div><div class="muted">Verificando el enlace seguro con el navegador asignado.</div></section></main><script src="/rey-ink-bg.js?v=17"></script><script>
const LINK_API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link',CMD_API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link-commands';
const qs=new URLSearchParams(location.search),token=(qs.get('d')||qs.get('token')||'').trim();let deviceId='',pollTimer=null;const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function json(url,opt={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'_ri='+Date.now(),{...opt,signal:ctrl.signal,cache:'no-store'}),text=await r.text();let x={};try{x=JSON.parse(text)}catch{throw Error('El servidor devolvió una respuesta inválida ('+r.status+').')}if(!r.ok||x.ok===false)throw Error(x.error||('HTTP '+r.status));return x}finally{clearTimeout(timer)}}
function errorView(msg){app.innerHTML='<span class="pill bad">NO CONECTADO</span><div class="title">No se pudo validar el enlace</div><div class="muted">'+esc(msg)+'</div><button class="btn config" style="margin-top:17px" onclick="load()">↻ REINTENTAR</button>'}
async function load(){if(!token){errorView('Falta el código de acceso del enlace.');return}try{const x=await json(LINK_API+'?token='+encodeURIComponent(token));if(x.link?.active===false)throw Error('Este link está revocado.');deviceId=x.device?.id||'';if(!deviceId)throw Error('Este link no tiene un navegador asignado.');render(x);await refresh()}catch(e){errorView(e.name==='AbortError'?'El servidor tardó demasiado en responder.':e.message||'Error desconocido.')}}
function render(x){app.innerHTML='<span class="pill">ACCESO REMOTO</span><div class="title">'+esc(x.client?.name||x.link?.label||'Cliente')+'</div><div class="muted">Este enlace controla únicamente el navegador asignado. No necesitas iniciar sesión en el Control Center.</div><div class="state"><div class="k">ESTADO DEL NAVEGADOR</div><div id="online" style="margin-top:7px"><b>—</b></div><div id="seen" class="muted" style="font-size:12px;margin-top:5px"></div></div><div class="grid"><div class="card"><div class="k">NAVEGADOR</div><div class="v">'+esc(x.device?.name||'Navegador')+'</div></div><div class="card"><div class="k">LICENCIA</div><div class="v">'+esc(x.license?.status||'Activa')+'</div></div><div class="card"><div class="k">VENCIMIENTO</div><div class="v">'+(x.license?.expires_at?esc(new Date(x.license.expires_at).toLocaleDateString()):'—')+'</div></div></div><div class="actions"><button class="btn start" onclick="send('bot_start')">▶ INICIAR BOT</button><button class="btn stop" onclick="send('bot_stop')">■ DETENER BOT</button><button class="btn config" onclick="configure()">⚙ CONFIGURAR</button><button class="btn" onclick="send('bot_state')">◉ ACTUALIZAR ESTADO</button></div><div id="log" class="log">Listo. El control se envía al navegador asignado y espera confirmación.</div>'}
async function refresh(){if(!deviceId)return;try{const x=await json(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token));const d=x.device||{};const online=document.getElementById('online'),seen=document.getElementById('seen');if(online)online.innerHTML='<b style="color:'+(d.is_online?'var(--g)':'var(--r)')+'">'+(d.is_online?'● CONECTADO':'● DESCONECTADO')+'</b>';if(seen)seen.textContent=d.last_seen_at?'Último contacto: '+new Date(d.last_seen_at).toLocaleString():'Sin contacto registrado';}catch(e){const el=document.getElementById('online');if(el)el.innerHTML='<b style="color:var(--r)">● REMOTO SIN RESPUESTA</b>'}}
async function send(command,payload={}){const log=document.getElementById('log');try{log.textContent='Enviando '+command+'…';const x=await json(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command,payload})});const id=x.command?.id;if(!id)throw Error('El servidor no devolvió la orden.');for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,500));const s=await json(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token)+'&command_id='+encodeURIComponent(id));if(s.command?.status==='completed'){log.textContent='✓ '+command+' ejecutado correctamente.';await refresh();return}if(s.command?.status==='failed'||s.command?.status==='error')throw Error(s.command.error_message||'La extensión reportó un error.')}throw Error('El navegador no confirmó la orden a tiempo.')}catch(e){log.textContent='✕ '+(e.message||'Error al enviar la orden');await refresh()}}
async function configure(){const min=prompt('Intervalo mínimo en minutos:','15');if(min===null)return;const max=prompt('Intervalo máximo en minutos:',min);if(max===null)return;send('bot_config',{min:Number(min)||15,max:Number(max)||Number(min)||15})}
load();pollTimer=setInterval(refresh,5000);
</script></body></html>
