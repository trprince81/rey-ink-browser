<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink — Control remoto</title><style>:root{--bg:#05060b;--panel:#0b0e18;--line:#292e45;--v:#a66bff;--g:#39efad;--r:#ff5577;--mut:#858ca5}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:#03040a;color:#f7f6ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{background-image:radial-gradient(circle at 80% 0,#32205c55,transparent 35%)}.wrap{width:min(900px,94vw);margin:30px auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.logo{font-size:23px;font-weight:950}.logo span{color:var(--v)}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#173a30;color:var(--g);font-size:11px;font-weight:900}.bad{background:#3a1721;color:#ff9bb0}.hero,.card{border:1px solid var(--line);border-radius:22px;background:#0b0e18ee;box-shadow:0 20px 70px #0008}.hero{padding:24px}.title{font-size:30px;font-weight:950;margin:10px 0 5px}.muted{color:var(--mut);line-height:1.6}.state{margin:18px 0;padding:18px;border-radius:16px;border:1px solid #252a40;background:#080b12}.state b{font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.card{padding:15px;border-radius:15px;background:#080b12}.k{font-size:10px;color:var(--mut);letter-spacing:1px}.v{margin-top:6px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.btn{border:1px solid #30364d;background:#151927;color:#fff;border-radius:11px;padding:13px;font-weight:900;cursor:pointer}.start{background:linear-gradient(135deg,#39efad,#1ebd7c);color:#04110b;border:0}.stop{background:linear-gradient(135deg,#ff5577,#a92748);border:0}.config{background:linear-gradient(135deg,#a66bff,#6e32d8);border:0}.log{margin-top:14px;min-height:45px;padding:12px;border-radius:12px;background:#080b12;border:1px solid #20243a;color:var(--mut);font-size:12px}.back{color:#b5bad0;text-decoration:none}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body><main class="wrap"><div class="top"><div class="logo">👑 Rey <span>Ink</span></div><a class="back" href="/">Control Center</a></div><section id="app" class="hero"><span class="pill">CONECTANDO</span><div class="title">Validando acceso…</div><div class="muted">Verificando el enlace seguro con el navegador asignado.</div></section></main><script src="/rey-ink-bg.js?v=17"></script><script>
const LINK_API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link',CMD_API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link-commands';
const qs=new URLSearchParams(location.search);const token=(qs.get('d')||qs.get('token')||'').trim();let deviceId='',pollTimer=null;const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function json(url,opt={}){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);try{const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'_ri='+Date.now(),{...opt,signal:ctrl.signal,cache:'no-store'});const text=await r.text();let x={};try{x=JSON.parse(text)}catch{throw Error('El servidor devolvió una respuesta inválida ('+r.status+').')}if(!r.ok||x.ok===false)throw Error(x.error||('HTTP '+r.status));return x}finally{clearTimeout(timer)}}
async function load(){if(!token){app.innerHTML='<span class="pill bad">LINK INVÁLIDO</span><div class="title">Falta el código de acceso</div>';return}try{const x=await json(LINK_API+'?token='+encodeURIComponent(token));if(x.link?.active===false)throw Error('Este link está revocado.');deviceId=x.device?.id||'';if(!deviceId)throw Error('Este link no tiene un navegador asignado.');render(x);await refresh()}catch(e){app.innerHTML='<span class="pill bad">ERROR DE CONEXIÓN</span><div class="title">No se pudo abrir el control remoto</div><div class="muted">'+esc(e.name==='AbortError'?'El servidor tardó demasiado en responder.':e.message)+'</div><button class="btn config" style="margin-top:16px" onclick="load()">↻ REINTENTAR</button>'}}
function render(x){app.innerHTML='<span class="pill">ACCESO REMOTO</span><div class="title">'+esc(x.client?.name||x.link?.label||'Cliente')+'</div><div class="muted">Este enlace controla únicamente el navegador asignado. No necesitas iniciar sesión en el Control Center.</div><div class="state"><div class="k">ESTADO DEL NAVEGADOR</div><div id="online" style="margin-top:6px"><b>—</b></div><div id="seen" class="muted" style="font-size:12px;margin-top:5px"></div></div><div class="grid"><div class="card"><div class="k">NAVEGADOR</div><div class="v">'+esc(x.device?.name||'Navegador')+'</div></div><div class="card"><div class="k">LICENCIA</div><div class="v">'+esc(x.license?.status||'Activa')+'</div></div><div class="card"><div class="k">VENCIMIENTO</div><div class="v">'+(x.license?.expires_at?esc(new Date(x.license.expires_at).toLocaleDateString()):'—')+'</div></div></div><div class="actions"><button class="btn start" onclick="send('bot_start')">▶ INICIAR BOT</button><button class="btn stop" onclick="send('bot_stop')">■ DETENER BOT</button><button class="btn config" onclick="configure()">⚙ CONFIGURAR</button><button class="btn" onclick="send('bot_state')">◉ ACTUALIZAR ESTADO</button></div><div id="log" class="log">Listo. El control se envía al navegador asignado y espera confirmación.</div>'}
async function refresh(){if(!deviceId)return;try{const x=await json(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token));const d=x.device||{};const online=document.getElementById('online'),seen=document.getElementById('seen');if(online)online.innerHTML='<b style="color:'+(d.is_online?'var(--g)':'var(--r)')+'">'+(d.is_online?'● CONECTADO':'● DESCONECTADO')+'</b>';if(seen)seen.textContent=d.last_seen_at?'Último contacto: '+new Date(d.last_seen_at).toLocaleString():'Sin contacto registrado';}catch(e){const el=document.getElementById('online');if(el)el.innerHTML='<b style="color:var(--r)">● REMOTO SIN RESPUESTA</b>'}}
async function send(command,payload={}){const log=document.getElementById('log');try{log.textContent='Enviando '+command+'…';const x=await json(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command,payload})});const id=x.command?.id;if(!id)throw Error('El servidor no devolvió la orden.');for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,500));const s=await json(CMD_API+'?d='+encodeURIComponent(deviceId)+'&token='+encodeURIComponent(token)+'&command_id='+encodeURIComponent(id));if(s.command?.status==='completed'){log.textContent='✓ '+command+' ejecutado correctamente.';await refresh();return}if(s.command?.status==='failed'||s.command?.status==='error')throw Error(s.command.error_message||'La extensión reportó un error.')}throw Error('El navegador no confirmó la orden a tiempo.')}catch(e){log.textContent='✕ '+e.message;await refresh()}}
async function configure(){const min=prompt('Intervalo mínimo en minutos:','15');if(min===null)return;const max=prompt('Intervalo máximo en minutos:',min);if(max===null)return;send('bot_config',{min:Number(min)||15,max:Number(max)||Number(min)||15})}
load();pollTimer=setInterval(refresh,5000);
</script></body></html>
