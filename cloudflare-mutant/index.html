<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#010302"><title>MUTANT — Licencias</title><style>body{margin:0;background:#010302;color:#f3fff7;font:16px system-ui;text-align:center;padding:40px 16px}main{max-width:720px;margin:auto;padding:30px;border:1px solid #27ff8355;border-radius:24px;background:#06120b}h1{font-size:42px;margin:0 0 10px}b{color:#27ff83}p{color:#9aafa3}input,select,button{display:block;width:100%;max-width:600px;margin:14px auto;padding:16px;border-radius:12px;box-sizing:border-box;background:#020a06;color:white;border:1px solid #28533a;font-size:16px}button{background:#0b3b21;border-color:#27ff83;font-weight:800;cursor:pointer}#status{min-height:24px}#key{display:none;margin:20px auto;padding:18px;border:1px solid #27ff83;border-radius:12px;color:#27ff83;font-weight:900;word-break:break-all}</style></head><body><main><h1>MUT<b>ANT</b></h1><p>Generador oficial de licencias</p><input id="email" type="email" placeholder="correo del cliente"><select id="plan"><option value="">Cargando planes...</option></select><button id="go">⚡ GENERAR LICENCIA</button><div id="status">Conectando con Supabase...</div><div id="key"></div></main><script>const API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/mutant-license-api';const plans=[['624ae7b7-ab3a-47f4-87b4-60a03c5fcf35','Especial 5',5,13],['75381f13-9a0f-4656-a278-7fe821540023','Básico 10',10,20],['f79fd60b-129e-4eac-902b-defc92a62952','Pro 35',35,30],['eda69b18-3df4-42da-9380-70cb64d5a0c6','Plus 50',50,50],['3f072c16-f414-458f-8b37-11a9c5e10fd7','Business 100',100,70],['4d14e7a4-413d-4de3-ab21-bb7b3f310046','Enterprise 500',500,150],['5b8295bf-e43d-48aa-b459-922e06bd2aa5','Max 1000',1000,350]];const $=x=>document.getElementById(x);async function load(){try{let r=await fetch(API+'/plans'),j=await r.json();if(!r.ok||!j.ok)throw 0;let p=j.plans||[];$('plan').innerHTML='<option value="">Selecciona un plan</option>'+p.map(x=>'<option value="'+x.id+'">'+x.name+' · '+x.max_profiles+' perfiles</option>').join('');$('status').textContent='✓ Mutant listo.'}catch(e){$('plan').innerHTML='<option value="">Selecciona un plan</option>'+plans.map(x=>'<option value="'+x[0]+'">'+x[1]+' · '+x[2]+' perfiles · $'+x[3]+'/mes</option>').join('');$('status').textContent='✓ Mutant listo.'}}$('go').onclick=async()=>{let email=$('email').value.trim().toLowerCase(),plan_id=$('plan').value;if(!/^\S+@\S+\.\S+$/.test(email))return $('status').textContent='Escribe un correo válido.';if(!plan_id)return $('status').textContent='Selecciona un plan.';$('go').disabled=true;$('status').textContent='Generando licencia...';try{let r=await fetch(API+'/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,plan_id})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudo generar');$('key').style.display='block';$('key').textContent=j.license.key;$('status').textContent='✓ Licencia generada y guardada.'}catch(e){$('status').textContent='⚠ '+e.message}finally{$('go').disabled=false}};load()</script></body></html>
