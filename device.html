<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey ink — Dispositivo</title><style>:root{--bg:#05060b;--text:#f7f8ff;--muted:#858aa3;--green:#42f5a7;--violet:#8b5cf6;--red:#ff5275;--cyan:#35d7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#3a216c 0,transparent 36%),radial-gradient(circle at 0 80%,#10364b 0,transparent 30%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(980px,94vw);margin:28px auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--cyan)}.back{color:#b6bbd0;text-decoration:none}.hero{padding:22px;border-radius:22px;border:1px solid #30354c;background:linear-gradient(145deg,#121522ee,#080a11ee);box-shadow:0 25px 70px #0008}.code{color:var(--muted);font-size:11px}.state{margin-top:16px;display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#777}.online{background:var(--green);box-shadow:0 0 13px var(--green)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{padding:16px;border-radius:16px;background:#ffffff07;border:1px solid #252a3e}.k{color:var(--muted);font-size:10px;letter-spacing:.7px}.v{font-size:23px;font-weight:900;margin-top:5px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #34394e;background:#151927;color:white;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer}.btn:hover{transform:translateY(-1px);border-color:#7660cf}.start{background:linear-gradient(135deg,#42f5a7,#19b873);color:#06120b;border:0}.stop{background:linear-gradient(135deg,#ff5275,#b52b4b);border:0}.save{background:linear-gradient(135deg,#8b5cf6,#5b21b6);border:0}.settings{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:11px;border-radius:10px;border:1px solid #30354a;background:#090b12;color:white}.editor{margin-top:16px;padding:18px;border:1px solid #292e45;border-radius:18px;background:#0b0e17}.editor h2{margin:0 0 5px}.editor p{color:var(--muted);font-size:11px;margin-top:0}.editorGrid{display:grid;gap:10px;margin-top:12px}.editorGrid textarea{min-height:150px;resize:vertical}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}.modal.show{display:grid}.dialog{width:min(650px,96vw);background:#0c0f19;border:1px solid #353a55;border-radius:20px;padding:20px;box-shadow:0 25px 80px #000}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:600px){.grid,.settings{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div class="wrap"><div class="head"><div class="brand">👑 Rey <span>ink</span></div><a class="back" href="/">← Control Center</a></div><div id="app" class="hero">Cargando dispositivo…</div></div><div id="modal" class="modal"><div class="dialog"><h2>Editar post</h2><p>Los cambios se envían al dispositivo y la extensión los ejecuta en la página abierta.</p><div class="editorGrid"><input id="postTitle" class="field" placeholder="Título del post"><textarea id="postBody" class="field" placeholder="Descripción / contenido"></textarea></div><div class="row"><button class="btn" onclick="closeEditor()">Cancelar</button><button class="btn save" onclick="sendEdit()">Guardar y enviar</button></div></div></div><script>
const p=new URLSearchParams(location.search),id=p.get('d'),token=p.get('token');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){if(!id||!token)return $('app').textContent='Link inválido.';try{const r=await fetch('/api/device?id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token));const j=await r.json();if(!r.ok)throw Error(j.error||'No autorizado');const d=j.device;$('app').innerHTML=`<div class="code">${esc(d.device_code)} · ${esc(d.device_type)}</div><h1 style="margin:5px 0 0">${esc(d.name)}</h1><div class="state"><span class="dot ${d.is_online?'online':''}"></span><b>${d.is_online?'CONECTADO':'OFFLINE'}</b></div><div class="grid"><div class="card"><div class="k">ACTUALIZADOR</div><div class="v">${d.updater_running?'ACTIVO':'DETENIDO'}</div></div><div class="card"><div class="k">INTERVALO</div><div class="v">${Math.round(d.bump_interval_seconds/60)} min</div></div><div class="card"><div class="k">PRÓXIMO BUMP</div><div class="v">${d.next_bump_at?new Date(d.next_bump_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—'}</div></div></div><div class="controls"><button class="btn start" onclick="cmd('start')">▶ INICIAR</button><button class="btn stop" onclick="cmd('stop')">■ DETENER</button><button class="btn save" onclick="cmd('bump')">↻ BUMP AHORA</button><button class="btn" onclick="cmd('open_my_posts')">MY POSTS</button><button class="btn" onclick="openEditor()">✎ EDITAR POST</button></div><div class="settings"><input id="interval" class="field" type="number" min="1" max="1440" value="${Math.round(d.bump_interval_seconds/60)}" placeholder="Minutos"><button class="btn" onclick="saveInterval()">Guardar intervalo</button></div><div class="editor"><h2>📝 Editor remoto</h2><p>Prepara cambios desde cualquier dispositivo. La extensión conectada recibirá la orden.</p><button class="btn save" onclick="openEditor()">Abrir editor</button></div>`}catch(e){$('app').textContent=e.message}}
async function cmd(command){const r=await fetch('/api/device',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,token,command})});const j=await r.json();alert(r.ok?'Orden enviada: '+command:(j.error||'Error'));load()}
async function saveInterval(){const minutes=Number($('interval').value);const r=await fetch('/api/device',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,token,command:'settings',payload:{bump_interval_seconds:minutes*60}})});const j=await r.json();alert(r.ok?'Intervalo guardado':'Error: '+(j.error||''));load()}
function openEditor(){ $('modal').classList.add('show') }function closeEditor(){ $('modal').classList.remove('show') }
async function sendEdit(){const payload={title:$('postTitle').value,body:$('postBody').value};const r=await fetch('/api/device',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,token,command:'edit_post',payload})});const j=await r.json();if(!r.ok)return alert(j.error||'No se pudo enviar');closeEditor();alert('Cambios enviados al dispositivo.');load()}
const $=id=>document.getElementById(id);load();setInterval(load,10000);
</script></body></html>
