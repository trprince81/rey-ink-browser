<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink — Panel del cliente</title><style>:root{--bg:#05060b;--text:#f7f8ff;--muted:#858aa3;--green:#42f5a7;--violet:#8b5cf6;--red:#ff5275;--cyan:#35d7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#03040a;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1000px,94vw);margin:28px auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--cyan)}.back{color:#b6bbd0;text-decoration:none}.hero{padding:22px;border-radius:22px;border:1px solid #30354c;background:linear-gradient(145deg,#121522ee,#080a11ee);box-shadow:0 25px 70px #0008}.code{color:var(--muted);font-size:11px}.state{margin-top:16px;display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#777}.online{background:var(--green);box-shadow:0 0 13px var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{padding:16px;border-radius:16px;background:#ffffff07;border:1px solid #252a3e}.k{color:var(--muted);font-size:10px;letter-spacing:.7px}.v{font-size:22px;font-weight:900;margin-top:5px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #34394e;background:#151927;color:white;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer}.start{background:linear-gradient(135deg,#42f5a7,#19b873);color:#06120b;border:0}.stop{background:linear-gradient(135deg,#ff5275,#b52b4b);border:0}.save{background:linear-gradient(135deg,#8b5cf6,#5b21b6);border:0}.settings{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:10px}.field{width:100%;padding:11px;border-radius:10px;border:1px solid #30354a;background:#090b12;color:white}.editor{margin-top:16px;padding:18px;border:1px solid #292e45;border-radius:18px;background:#0b0e17}.editor h2{margin:0 0 5px}.editor p{color:var(--muted);font-size:11px;margin-top:0}.editorGrid{display:grid;gap:10px;margin-top:12px}.editorGrid textarea{min-height:150px;resize:vertical}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}.modal.show{display:grid}.dialog{width:min(650px,96vw);background:#0c0f19;border:1px solid #353a55;border-radius:20px;padding:20px}.row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.settings{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div class="wrap"><div class="head"><div class="brand">👑 Rey <span>Ink</span></div><a class="back" href="/">← Control Center</a></div><div id="app" class="hero">Cargando panel…</div></div><div id="modal" class="modal"><div class="dialog"><h2>Editar post</h2><p style="color:var(--muted)">El cambio se enviará a la PC conectada y el panel esperará confirmación.</p><div class="editorGrid"><input id="postTitle" class="field" placeholder="Título del post"><textarea id="postBody" class="field" placeholder="Descripción / contenido"></textarea></div><div class="row"><button class="btn" onclick="closeEditor()">Cancelar</button><button class="btn save" onclick="sendEdit()">Guardar y enviar</button></div></div></div><script src="/rey-ink-bg.js"></script><script>
const p=new URLSearchParams(location.search),id=p.get('d'),token=p.get('token'),API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/rey-ink-client-link-commands';
const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(body=null){const u=API+'?d='+encodeURIComponent(id||'')+'&token='+encodeURIComponent(token||'')+(body?.commandId?'&command_id='+encodeURIComponent(body.commandId):'');const r=await fetch(u,{method:body?'POST':'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify({command:body.command,payload:body.payload||{}}):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(j.error||'No autorizado');return j}
function card(k,v){return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`}
async function load(){if(!id||!token)return $('app').textContent='Link inválido.';try{const j=await api(),d=j.device||{};$('app').innerHTML=`<div class="code">${esc(d.id||id)} · PC</div><h1 style="margin:5px 0 0">${esc(d.name||'Mi PC')}</h1><div class="state"><span class="dot ${d.is_online?'online':''}"></span><b>${d.is_online?'CONECTADO':'OFFLINE'}</b></div><div class="grid">${card('ESTADO',d.is_online?'ONLINE':'OFFLINE')}${card('ÚLTIMO CONTACTO',d.last_seen_at?new Date(d.last_seen_at).toLocaleString():'—')}${card('ORDENES','Cola remota')}${card('TRANSPORTE','Supabase')}</div><div class="controls"><button class="btn start" onclick="cmd('bot_start')">▶ INICIAR</button><button class="btn stop" onclick="cmd('bot_stop')">■ DETENER</button><button class="btn save" onclick="cmd('bump')">↻ BUMP AHORA</button><button class="btn" onclick="cmd('open_my_posts')">MY POSTS</button><button class="btn" onclick="openEditor()">✎ EDITAR POST</button></div><div class="settings"><input id="interval" class="field" type="number" min="1" max="1440" value="16" placeholder="Minutos"><button class="btn" onclick="saveInterval()">Guardar intervalo</button></div><div class="editor"><h2>📝 Editor remoto</h2><p>Las órdenes ahora entran en una cola persistente y el panel espera el resultado de la extensión.</p></div>`}catch(e){$('app').innerHTML='<h2>No se pudo abrir el panel</h2><p style="color:var(--muted)">'+esc(e.message)+'</p>'}}
async function waitResult(commandId){for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,1000));try{const j=await api({commandId});const s=j.command?.status;if(s==='completed')return j.command;if(s==='error')throw Error(j.command.error_message||'La extensión reportó un error.')}catch(e){if(i===29)throw e}}throw Error('Tiempo de espera agotado.')}
async function cmd(command,payload={}){try{const j=await api({command,payload});if(!j.command?.id)throw Error('El servidor no devolvió la orden.');await waitResult(j.command.id);alert('Orden ejecutada: '+command);load()}catch(e){alert('No se pudo completar: '+e.message);load()}}
async function saveInterval(){try{const minutes=Math.max(1,Number($('interval').value)||16);await cmd('settings',{bump_interval_seconds:minutes*60})}catch(e){alert(e.message)}}function openEditor(){$('modal').classList.add('show')}function closeEditor(){$('modal').classList.remove('show')}async function sendEdit(){try{await cmd('edit_post',{title:$('postTitle').value,body:$('postBody').value});closeEditor()}catch(e){alert(e.message)}}load();setInterval(load,10000);
</script></body></html>
