<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink</title><style>body{margin:0;width:380px;background:#08060e;color:#fff;font:14px system-ui}main{padding:14px}.card{background:#110d19;border:1px solid #302044;border-radius:15px;padding:14px;margin-bottom:10px}.brand{font-size:22px;font-weight:900}.sub{color:#a89db6}.status{padding:11px;border-radius:10px;background:#09070d;margin:12px 0}.ok{color:#55f2a1}.err{color:#ff7187}button,input{font:inherit;width:100%;padding:11px;border:0;border-radius:10px;margin:4px 0}button{background:#7b32f5;color:white;font-weight:800}button.red{background:#8b2140}input{background:#0a0810;color:white;border:1px solid #38294d}</style></head><body><main><div class="brand">👑 Rey ink</div><div class="sub">Control remoto</div><section class="card"><div id="status" class="status">Comprobando conexión…</div><label>PC</label><input id="pc" type="number" min="1" max="20" value="1"><button id="connect">🟢 CONECTAR</button><button id="disconnect" class="red">⛔ DESCONECTAR</button></section><section class="card"><b>Pestaña controlada</b><div id="tab" class="status">—</div><button id="reload">↻ RECARGAR</button><button id="back">‹ ATRÁS</button><button id="forward">ADELANTE ›</button></section></main><script src="control.js"></script></body></html>
