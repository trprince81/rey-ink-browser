<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink</title><style>*{box-sizing:border-box}body{margin:0;width:430px;background:#090711;color:#eee;font:14px Arial,sans-serif}header{padding:15px;border-bottom:1px solid #2b223b;background:#0d0915}h1{font-size:21px;margin:0}.sub,.muted{color:#999;font-size:11px}main{padding:12px}.acc{border:1px solid #302044;border-radius:14px;overflow:hidden;background:#110d19;margin-bottom:9px}.head{width:100%;padding:14px;background:#15101f;color:#fff;border:0;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer}.head .title{flex:1;font-weight:bold}.num{font-size:11px;color:#9e82d6}.body{display:none;padding:13px;border-top:1px solid #2b223b}.acc.open .body{display:block}.status{background:#0b0811;border-radius:9px;padding:9px;margin:4px 0 8px;color:#bbb}.ok{color:#8ff0ad}.err{color:#ff8b9c}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 11px;margin:3px 2px 0 0;background:#7627ff;color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#292238}button.danger{background:#731a31}input,select{width:100%;padding:10px;background:#0b0811;color:#fff;border:1px solid #33264a;border-radius:9px;margin:3px 0}.row{display:flex;gap:5px;flex-wrap:wrap}.list{max-height:190px;overflow:auto;margin-top:8px}.item{padding:9px;border-bottom:1px solid #241b31;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}.item small{color:#999}.log{margin-top:8px;background:#07060b;border-radius:9px;padding:8px;max-height:90px;overflow:auto;font-size:11px;white-space:pre-wrap}.code{text-align:center;font-size:27px;letter-spacing:5px;padding:9px;background:#0b0811;border-radius:9px;margin-top:8px}</style></head><body><header><h1>👑 Rey Ink</h1><div class="sub">Esta PC se configura automáticamente</div></header><main><section class="acc open"><button class="head"><span class="num">01</span><span>🖥️</span><span class="title">Esta computadora</span><span>›</span></button><div class="body"><div class="muted">Solo selecciona el número de esta computadora.</div><select id="pcSlot"><option value="">Selecciona una PC</option><option>PC 1</option><option>PC 2</option><option>PC 3</option><option>PC 4</option><option>PC 5</option><option>PC 6</option><option>PC 7</option><option>PC 8</option><option>PC 9</option><option>PC 10</option><option>PC 11</option><option>PC 12</option><option>PC 13</option><option>PC 14</option><option>PC 15</option><option>PC 16</option><option>PC 17</option><option>PC 18</option><option>PC 19</option><option>PC 20</option></select><div id="relayStatus" class="status">● Selecciona una PC</div><button id="relaySave">🟢 Guardar y conectar</button><button id="relayOff" class="danger">⛔ Desconectar</button><div id="pairCode" class="code">PC--</div><div class="muted">Rey Ink: https://rey-ink-browser.vercel.app/</div></div></section><section class="acc"><button class="head"><span class="num">02</span><span>🤖</span><span class="title">Grabaciones y bot</span><span>›</span></button><div class="body"><div id="botStatus" class="status">● Bot detenido</div><button id="record">🔴 Grabar</button><button id="stopRecord" class="danger">⏹ Detener</button><div id="recordStatus" class="muted">Listo.</div><button id="save" class="secondary">💾 Guardar grabación</button><div class="row"><input id="interval" type="number" min="1" value="16" style="width:120px"><button id="start">▶️ Ejecutar seleccionada</button><button id="stop" class="danger">⛔ Detener bot</button></div><div id="routines" class="list"></div><button id="export" class="secondary">📤 Exportar</button><button id="import" class="secondary">📥 Importar</button><input id="file" type="file" accept=".json,application/json" style="display:none"></div></section><section class="acc"><button class="head"><span class="num">03</span><span>🌐</span><span class="title">Navegador</span><span>›</span></button><div class="body"><div id="browserStatus" class="status">● Sin comprobar</div><button id="check">🔎 Comprobar pestaña</button><button id="reload" class="secondary">🔄 Recargar</button><div class="row"><input id="url" placeholder="https://..."><button id="go">Ir</button></div></div></section><section class="acc"><button class="head"><span class="num">04</span><span>⚙️</span><span class="title">Diagnóstico</span><span>›</span></button><div class="body"><button id="state">📡 Diagnóstico</button><div id="diag" class="log">Pulsa Diagnóstico.</div></div></section><div id="log" class="log"></div></main><script src="control.js"></script></body></html>
