<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink</title><style>*{box-sizing:border-box}body{margin:0;width:420px;background:#08060e;color:#fff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:16px;background:linear-gradient(135deg,#171027,#0c0813);border-bottom:1px solid #33234a;display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#7b2cff,#4f16c9);display:grid;place-items:center;font-size:24px;box-shadow:0 0 22px #5d20d055}.brand{font-size:21px;font-weight:900}.sub{font-size:11px;color:#a89db6;margin-top:2px}main{padding:12px}.card{background:#110d19;border:1px solid #302044;border-radius:15px;margin-bottom:10px;overflow:hidden}.title{padding:12px 14px;background:#161021;font-weight:850;display:flex;align-items:center;gap:9px}.body{padding:12px}.status{background:#09070d;border-radius:10px;padding:9px;color:#aaa;margin-bottom:8px;white-space:pre-wrap}.ok{color:#8df3ae}.err{color:#ff8296}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 11px;margin:3px 3px 0 0;background:#7628ff;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#292238}button.danger{background:#761e36}input,select{width:100%;padding:10px;background:#0a0810;color:#fff;border:1px solid #38294d;border-radius:10px;margin:3px 0}.row{display:flex;gap:5px}.row>*{flex:1}.small{font-size:11px;color:#918699}.routine{padding:9px;border:1px solid #2a2037;border-radius:10px;margin-top:6px}.routine b{display:block}.pill{display:inline-block;background:#27163d;color:#c8b1ff;border-radius:999px;padding:3px 7px;font-size:10px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.hero{background:linear-gradient(135deg,#7c2cff,#4f1ac7);box-shadow:0 8px 25px #6d22ff30}.stop{background:#762039}</style></head><body><header><div class="logo">♛</div><div><div class="brand">Rey Ink</div><div class="sub">Control remoto real · Auto clic</div></div></header><main>
<section class="card"><div class="title">🖥️ Esta computadora</div><div class="body"><select id="pc"><option value="">Selecciona PC</option></select><div id="relay" class="status">Selecciona la PC de esta computadora.</div><button id="connect" class="hero">🟢 Conectar</button><button id="disconnect" class="danger">⛔ Desconectar</button></div></section>
<section class="card"><div class="title">🎯 Auto clic programable</div><div class="body"><div class="small">Graba los clics reales que haces en una página, guárdalos y deja que Rey Ink los repita automáticamente.</div><div id="autoStatus" class="status">Listo.</div><button id="record" class="hero">🔴 Grabar clics</button><button id="stopRecord" class="danger">⏹ Terminar</button><div class="row"><input id="minutes" type="number" min="0.5" step="0.5" value="16" placeholder="Minutos"><button id="schedule">⏱️ Cada X minutos</button></div><div class="grid"><button id="run">▶ Ejecutar ahora</button><button id="stopSchedule" class="stop">■ Parar programa</button></div><div id="routines"></div></div></section>
<section class="card"><div class="title">🌐 Navegador</div><div class="body"><div id="browser" class="status">Sin comprobar.</div><div class="grid"><button id="check" class="secondary">🔎 Comprobar</button><button id="reload" class="secondary">↻ Recargar</button><button id="back" class="secondary">‹ Atrás</button><button id="forward" class="secondary">Adelante ›</button></div><div class="row"><input id="url" placeholder="https://..."><button id="go">Ir</button></div></div></section>
<section class="card"><div class="title">🧪 Diagnóstico</div><div class="body"><button id="diagBtn" class="secondary">Ver diagnóstico</button><pre id="diag" class="status" style="max-height:130px;overflow:auto">—</pre></div></section></main><script src="control.js"></script></body></html>
