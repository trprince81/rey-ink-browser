<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey ink</title><style>*{box-sizing:border-box}body{margin:0;width:350px;padding:18px;background:#070812;color:#f7f7ff;font:14px system-ui}.card{border:1px solid #34304e;border-radius:20px;padding:18px;background:linear-gradient(145deg,#151329,#090a12);box-shadow:0 20px 50px #0008}h1{margin:0;font-size:21px}.muted{color:#9292ad;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:10px}input{width:110px;padding:9px;border-radius:10px;border:1px solid #3b3656;background:#090a12;color:#fff}button{width:100%;padding:11px;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}.start{background:#39e89b;color:#06120b}.stop{background:#ff4f70;color:white}.save{background:#8b5cf6;color:white}.status{padding:9px 12px;border-radius:12px;background:#ffffff08;margin:12px 0}.pair{margin-top:14px;padding-top:14px;border-top:1px solid #29263d}.pair input{width:100%;margin-top:6px}.hint{font-size:11px;color:#7f8199;line-height:1.4;margin-top:8px}</style></head><body><div class="card"><h1>👑 Rey ink</h1><div class="muted">Actualizador</div><div id="status" class="status">Cargando…</div><div class="row"><span>Intervalo (min)</span><input id="interval" type="number" min="1" value="16"></div><div class="row"><span>Espera (seg)</span><input id="wait" type="number" min="20" max="30" value="25"></div><button id="start" class="start">▶ INICIAR</button><button id="stop" class="stop">■ DETENER</button><div class="pair"><b>Conectar dispositivo</b><div class="muted">ID del dispositivo</div><input id="deviceId" placeholder="UUID del dispositivo"><div class="muted" style="margin-top:8px">Token del dispositivo</div><input id="deviceToken" placeholder="Token privado" type="password"><button id="pair" class="save">🔗 CONECTAR</button><div class="hint">El ID y token salen al crear el dispositivo desde Rey ink Control Center. No los compartas.</div></div></div><script src="popup.js"></script></body></html>
