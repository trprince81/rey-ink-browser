<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rey Ink Browser</title>
  <style>
    body{width:280px;margin:0;padding:16px;background:#08060f;color:#f7f4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    h1{font-size:19px;margin:0 0 6px}.muted{color:#aaa2b8;font-size:12px;margin-bottom:14px}
    button{width:100%;border:0;border-radius:11px;padding:12px;background:#7027ff;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}
    button.secondary{background:#21172f}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#0e0a16;font-size:12px;min-height:16px}
    .ok{color:#68e2a6}.err{color:#ff8f9a}
  </style>
</head>
<body>
  <h1>Rey Ink Browser</h1>
  <div class="muted">Control de la página actual</div>
  <button id="click">Ejecutar botón</button>
  <button id="state" class="secondary">Comprobar estado</button>
  <div id="msg" class="msg">Listo.</div>
  <script src="popup.js"></script>
</body>
</html>
