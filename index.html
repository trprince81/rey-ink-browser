<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070f"><title>Rey Ink — Control remoto</title><style>*{box-sizing:border-box}html,body{margin:0;background:#09070f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100%}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(135deg,#120c1d,#0d0915);border-bottom:1px solid #30223e}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7b2cff,#4f16c9);display:grid;place-items:center;font-size:23px;box-shadow:0 0 22px #6b21ff33}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:#aaa0b4}.pcpick{margin-left:auto;background:#21162e;border:1px solid #412d55;color:#fff;border-radius:999px;padding:9px 13px;font-weight:800}.urlbar{display:flex;gap:7px;padding:8px;background:#0e0a14;border-bottom:1px solid #2b2138}.urlbar input{flex:1;min-width:0;background:#17111f;border:1px solid #3a2b4c;border-radius:12px;color:#fff;padding:10px 12px;font-size:15px}.urlbar button,.toolbar button,.modes button{border:0;border-radius:11px;background:#251a34;color:#fff;padding:10px 13px;font-weight:800}.screen{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#05040a;overflow:hidden;touch-action:none;user-select:none}.screen img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;pointer-events:none}.empty{color:#aaa0b4;text-align:center;padding:30px}.bottom{background:#100c18;border-top:1px solid #2b2138;padding:7px 8px env(safe-area-inset-bottom)}.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.toolbar button{font-size:12px;padding:9px 3px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.modes button.active{background:#7027ff;box-shadow:0 0 16px #7027ff33}.keyboard{display:flex;gap:6px;margin-top:7px}.keyboard input{flex:1;background:#17111f;border:1px solid #3a2b4c;border-radius:11px;color:#fff;padding:10px}.keyboard button{background:#f2eef7;color:#111;border:0;border-radius:11px;padding:0 14px;font-weight:900}.status{font-size:12px;color:#aaa0b4;padding:5px 10px;text-align:center;white-space:pre-wrap}.hint{font-size:11px;color:#8f859b;text-align:center;margin-top:3px}.pcs{position:absolute;inset:64px 0 0;background:#09070f;padding:18px;overflow:auto;z-index:10}.pcs h2{margin:4px 0 14px}.pc{width:100%;margin:7px 0;padding:15px;background:#15101d;border:1px solid #332640;color:#fff;border-radius:14px;text-align:left;font-size:16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:7px}.on{background:#35d58d}.hidden{display:none!important}@media(min-width:800px){.app{max-width:1200px;margin:auto;border-left:1px solid #2b2138;border-right:1px solid #2b2138}.screen img{max-height:calc(100dvh - 255px)}} </style></head><body><div class="app"><header class="top"><div class="logo">♛</div><div><div class="brand">Rey Ink</div><div class="sub" id="sub">Navegador remoto</div></div><button class="pcpick" id="pcBtn">PCs</button></header><div class="urlbar"><input id="url" placeholder="Escribe una dirección…"><button id="go">Ir</button></div><main class="screen" id="screen"><div class="empty" id="empty">Selecciona una PC…</div></main><div class="bottom"><div class="toolbar"><button id="back">‹ Atrás</button><button id="forward">Adelante ›</button><button id="new">＋ Pestaña</button><button id="reload">↻ Recargar</button><button id="close">× Cerrar</button></div><div class="modes"><button id="modeClick" class="active">☝️ Interactuar</button><button id="modeScroll">↕️ Scroll</button><button id="modeDrag">✋ Arrastrar</button></div><div class="keyboard"><input id="text" placeholder="Escribe directamente en el navegador"><button id="send">Enviar</button><button id="enter">↵</button></div><div class="status" id="status">Esperando conexión…</div><div class="hint" id="hint">Interactuar: toca para hacer clic · Scroll: desliza · Arrastrar: mueve un elemento</div></div><section class="pcs hidden" id="pcs"><h2>Selecciona una PC</h2><div id="pcList"></div></section></div><script>
const API='/api/rey-ink';let pc=null,timer=null,mode='click',gesture=null,moved=false;const $=x=>document.getElementById(x);async function req(action,body={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,pc_slot:pc,...body}),cache:'no-store'});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||('HTTP '+r.status));return d}async function get(action,extra=''){const r=await fetch(API+'?action='+action+extra,{cache:'no-store'});return r.json()}function say(t){$('status').textContent=t}async function list(){try{const d=await get('list_devices'),box=$('pcList');box.innerHTML='';for(const x of d.devices||[]){const b=document.createElement('button');b.className='pc';b.innerHTML='<b>PC '+x.pc_slot+'</b><div><span class="dot '+(x.is_online?'on':'')+'"></span>'+(x.is_online?'En línea':'Sin conexión')+'</div>';b.onclick=()=>enter(Number(x.pc_slot));box.appendChild(b)}}catch{}}async function enter(n){pc=n;$('pcs').classList.add('hidden');$('pcBtn').textContent='PC'+n;say('Conectando con PC'+n+'…');try{await req('command',{command:'start_screen'});const s=await req('command',{command:'get_state'});$('url').value=s.url||'';$('sub').textContent='PC'+n+' · navegador remoto';say('🟢 PC'+n+' conectada · control real activo');start()}catch(e){say('⚠ '+e.message)}}function start(){if(timer)return;poll();timer=setInterval(poll,650)}async function poll(){if(!pc)return;try{const d=await get('last_result','&pc_slot='+pc);if(d.result?.screen){const img=$('screen').querySelector('img')||document.createElement('img');if(!img.parentNode)$('screen').appendChild(img);if(img.src!==d.result.image)img.src=d.result.image;$('empty').classList.add('hidden')}}catch{}}function point(e){const img=$('screen').querySelector('img');if(!img)return null;const r=img.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;return x>=0&&x<=1&&y>=0&&y<=1?{nx:x,ny:y}:null}function setMode(m){mode=m;['modeClick','modeScroll','modeDrag'].forEach(id=>$(id).classList.remove('active'));$('mode'+m[0].toUpperCase()+m.slice(1)).classList.add('active');$('hint').textContent=m==='click'?'Interactuar: toca para hacer clic':'Interactuar: '+(m==='scroll'?'desliza para desplazarte':'toca y mueve para arrastrar')}
$('screen').addEventListener('pointerdown',e=>{if(!pc)return;e.preventDefault();gesture={x:e.clientX,y:e.clientY};moved=false;try{$('screen').setPointerCapture(e.pointerId)}catch{}});$('screen').addEventListener('pointermove',e=>{if(!gesture)return;e.preventDefault();const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>8)moved=true;if(mode==='scroll'&&moved){const p=point(e)||{nx:.5,ny:.5};req('command',{command:'scroll',payload:{nx:p.nx,ny:p.ny,dx:-dx*2,dy:-dy*2}}).catch(()=>{});gesture={x:e.clientX,y:e.clientY}}});$('screen').addEventListener('pointerup',async e=>{if(!gesture)return;e.preventDefault();const start=gesture;gesture=null;const p=point(e);if(!p)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(mode==='click'&&!moved){try{await req('command',{command:'click',payload:p});say('🟢 Clic enviado')}catch(err){say('⚠ Clic: '+err.message)}}else if(mode==='drag'&&moved){try{const p1=point({clientX:start.x,clientY:start.y});await req('command',{command:'drag',payload:{nx1:p1?.nx||p.nx,ny1:p1?.ny||p.ny,nx2:p.nx,ny2:p.ny}});say('🟢 Arrastre enviado')}catch(err){say('⚠ Arrastre: '+err.message)}}});$('modeClick').onclick=()=>setMode('click');$('modeScroll').onclick=()=>setMode('scroll');$('modeDrag').onclick=()=>setMode('drag');$('go').onclick=async()=>{let u=$('url').value.trim();if(!u)return;if(!/^https?:/i.test(u))u='https://'+u;try{await req('command',{command:'navigate',payload:{url:u}});say('🟢 Navegando…')}catch(e){say('⚠ '+e.message)}};$('back').onclick=()=>req('command',{command:'back'}).catch(e=>say('⚠ '+e.message));$('forward').onclick=()=>req('command',{command:'forward'}).catch(e=>say('⚠ '+e.message));$('new').onclick=()=>req('command',{command:'new_tab'}).catch(e=>say('⚠ '+e.message));$('reload').onclick=()=>req('command',{command:'reload'}).catch(e=>say('⚠ '+e.message));$('close').onclick=()=>req('command',{command:'close_tab'}).catch(e=>say('⚠ '+e.message));$('send').onclick=async()=>{const v=$('text').value;if(!v)return;try{await req('command',{command:'type',payload:{text:v}});$('text').value='';say('🟢 Texto enviado')}catch(e){say('⚠ '+e.message)}};$('enter').onclick=()=>req('command',{command:'key',payload:{key:'Enter',code:'Enter'}}).catch(e=>say('⚠ '+e.message));$('text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('enter').click()}});$('pcBtn').onclick=async()=>{$('pcs').classList.remove('hidden');await list()};list().then(async()=>{try{const d=await get('list_devices'),online=(d.devices||[]).filter(x=>x.is_online);if(online.length===1)enter(Number(online[0].pc_slot))}catch{}});
</script></body></html>
