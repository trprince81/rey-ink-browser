<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey ink — Control Center</title><style>:root{--bg:#05060b;--panel:#0d1019;--line:#25283a;--text:#f7f8ff;--muted:#858aa3;--violet:#8b5cf6;--cyan:#35d7ff;--green:#42f5a7;--red:#ff5275}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#27145d 0,transparent 35%),radial-gradient(circle at 10% 20%,#102b42 0,transparent 28%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:22px 16px;border-right:1px solid #191c29;background:rgba(6,7,12,.72);backdrop-filter:blur(20px)}.brand{display:flex;gap:11px;align-items:center;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#a855f7,#4f46e5);box-shadow:0 0 28px #6d3ee855;font-size:23px}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.3px;margin-top:2px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aeb3c8;border:0;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#171522;color:#fff}.main{padding:28px;max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{font-size:28px;margin:0}.top p{margin:5px 0 0;color:var(--muted)}.pill{padding:8px 11px;border:1px solid #26304a;background:#101522;border-radius:999px;color:#aeb8d0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:linear-gradient(145deg,#10131eeb,#090b12e8);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 14px 35px #0005}.k{color:var(--muted);font-size:11px}.v{font-size:26px;font-weight:850;margin-top:6px}.ok{color:var(--green)}.devices{margin-top:15px}.device{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.name{font-weight:800}.meta{color:var(--muted);font-size:11px;margin-top:4px}.actions{display:flex;gap:7px}.btn{border:1px solid #303449;background:#151826;color:#fff;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.btn:hover{border-color:#6450a8}.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:0}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.device{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">♛</div><div><b>Rey ink</b><small>CONTROL CENTER</small></div></div><nav class="nav"><button class="active">⌂ Dashboard</button><button>◉ Dispositivos</button><button>▣ Posts</button><button>◌ Actividad</button><button>⚙ Configuración</button></nav></aside><main class="main"><div class="top"><div><h1>Dashboard</h1><p>Control central de tus dispositivos</p></div><div class="pill">● Sistema preparado</div></div><section class="grid"><div class="card"><div class="k">DISPOSITIVOS</div><div class="v">0</div></div><div class="card"><div class="k">EN LÍNEA</div><div class="v ok">0</div></div><div class="card"><div class="k">ACTUALIZADORES</div><div class="v">0</div></div><div class="card"><div class="k">ÚLTIMO BUMP</div><div class="v">—</div></div></section><section class="card devices"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px"><b>Mis dispositivos</b><button class="btn primary" onclick="alert('Siguiente fase: registro y enlace privado del dispositivo.')">＋ Agregar dispositivo</button></div><div class="device"><div><div class="name">Aún no hay dispositivos</div><div class="meta">La extensión aparecerá aquí cuando se registre.</div></div><div class="actions"><button class="btn" disabled>Control</button></div></div></section></main></div></body></html>
