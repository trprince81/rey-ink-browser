<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rey Ink</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08060f;color:#f7f4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 12px 40px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:#7027ff;display:grid;place-items:center;font-size:25px}.title{font-size:27px;font-weight:800}.muted{color:#aaa2b8;font-size:13px}.card{background:#15111f;border:1px solid #302541;border-radius:18px;padding:15px;margin:12px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.pc{border:1px solid #382a4d;background:#0f0b17;color:#fff;border-radius:13px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b6472;margin-right:7px}.on{background:#35d58d}.hidden{display:none}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#0e0a16;color:#c9c1d7;font-size:13px}.err{color:#ff8f9a}.ok{color:#68e2a6}.browser{margin-top:12px;border:1px solid #302541;border-radius:14px;min-height:300px;background:#0b0811;display:flex;align-items:center;justify-content:center;color:#aaa2b8;text-align:center;padding:8px;overflow:hidden;touch-action:none;user-select:none}.browser img{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;border-radius:8px;object-fit:contain;touch-action:none}.screenEmpty{padding:25px}.row{display:flex;gap:7px;flex-wrap:wrap}.row button,.controlbar button{border:0;border-radius:10px;padding:10px 12px;background:#21172f;color:#fff;font-weight:700;cursor:pointer}.primary{background:#7627ff!important}.danger{background:#a62b42!important}.badge{padding:5px 9px;border-radius:999px;background:#21172f;font-size:12px}.controlbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.controlbar button{flex:1;min-width:120px}.inputrow{display:flex;gap:7px;margin-top:8px}.inputrow input{flex:1;min-width:0;border:1px solid #33264a;border-radius:10px;padding:10px;background:#0b0811;color:#fff}.pcHead{display:flex;justify-content:space-between;align-items:center}@media(max-width:520px){.grid{grid-template-columns:1fr}.browser{min-height:270px}.browser img{max-height:58vh}.row button{flex:1}}
</style></head>
<body><main class="wrap">
<div class="brand"><div class="logo">♛</div><div><div class="title">Rey Ink</div><div class="muted">Tus PCs, desde el celular</div></div></div>
<section id="listCard" class="card"><div class="topline"><h2>PCs disponibles</h2><span class="badge" id="status">Comprobando…</span></div><div class="msg" id="message">Conectando con Rey Ink…</div><div class="grid" id="pcs"></div></section>
<section id="controlCard" class="card hidden">
 <div class="pcHead"><div><h2 id="ctrlTitle" style="margin:0">PC1</h2><div class="muted" id="connection">Comprobando…</div></div><button id="change">← PCs</button></div>
 <div class="browser" id="browser"><div class="screenEmpty"><strong>Cargando navegador…</strong><div>La pantalla se inicia automáticamente.</div></div></div>
 <div class="controlbar"><button id="record" class="primary">🔴 Grabar clics</button><button id="stopRecord" class="danger">⏹ Parar grabación</button><button id="screenStop">⏹ Parar pantalla</button></div>
 <div class="inputrow"><input id="textInput" placeholder="Escribe aquí para enviar texto al navegador"><button id="sendText">Enviar</button><button id="enter">↵</button></div>
 <div class="row" style="margin-top:8px"><button data-cmd="back">Atrás</button><button data-cmd="forward">Adelante</button><button data-cmd="new_tab">Nueva pestaña</button><button data-cmd="reload">Recargar</button></div>
 <div class="msg" id="result">Entraste a la PC. Toca la pantalla para hacer clic. Desliza para desplazarte.</div>
</section></main>
<script>
const API='/api/rey-ink';let selected=null,loading=false,screenTimer=null,drag=null;
async function apiGet(action,extra=''){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(API+'?action='+encodeURIComponent(action)+extra,{cache:'no-store',signal:c.signal});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}finally{clearTimeout(t)}}
async function api(body){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store',signal:c.signal});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}finally{clearTimeout(t)}}
const $=id=>document.getElementById(id);const show=id=>$(id).classList.remove('hidden');const hide=id=>$(id).classList.add('hidden');
async function load(){if(loading||selected)return;loading=true;try{const d=await apiGet('list_devices');const box=$('pcs');box.innerHTML='';for(let n=1;n<=20;n++){const x=(d.devices||[]).find(v=>Number(v.pc_slot)===n),b=document.createElement('button');b.className='pc';b.innerHTML='<b>PC '+n+'</b><div class="muted"><span class="dot '+(x&&x.is_online?'on':'')+'"></span>'+(x&&x.is_online?'En línea':'Sin conexión')+'</div>';b.onclick=()=>selectPc(n);box.appendChild(b)}$('status').textContent='Conectado';$('message').className='msg ok';$('message').textContent='Selecciona una PC. Al entrar, la pantalla se abrirá automáticamente.'}catch(e){$('status').textContent='Sin conexión';$('message').className='msg err';$('message').textContent=e.name==='AbortError'?'Vercel no respondió en 8 segundos.':e.message}finally{loading=false}}
async function selectPc(n){selected=n;hide('listCard');show('controlCard');$('ctrlTitle').textContent='PC'+n;$('browser').innerHTML='<div class="screenEmpty"><strong>Conectando…</strong><div>Preparando el navegador remoto.</div></div>';$('result').textContent='Conectando con PC'+n+'…';try{await send('start_screen');startPolling();await send('get_state')}catch(e){}}
async function back(){stopPolling();if(selected)try{await send('stop_screen')}catch{}selected=null;hide('controlCard');show('listCard');load()}
async function refreshState(){if(!selected)return;try{const d=await api({action:'get_state',pc_slot:selected});$('connection').textContent=d.ok&&d.is_online?'🟢 En línea':'🔴 Sin conexión'}catch(e){$('connection').textContent='⚠️ '+e.message}}
async function send(command,payload={}){if(!selected)return;try{const r=await api({action:'command',pc_slot:selected,command,payload});$('result').textContent=r.ok?'Orden enviada: '+command:(r.error||'Error');return r}catch(e){$('result').textContent=e.message;throw e}}
function renderFrame(result){if(!result?.screen||!result.image)return;const b=$('browser');let img=b.querySelector('img');if(!img){b.innerHTML='';img=document.createElement('img');b.appendChild(img)}img.src=result.image;img.dataset.w=String(result.width||img.naturalWidth||1);img.dataset.h=String(result.height||img.naturalHeight||1);$('connection').textContent='🟢 En línea · pantalla en vivo'}
async function pollScreen(){if(!selected)return;try{const d=await apiGet('last_result','&pc_slot='+encodeURIComponent(selected));renderFrame(d.result);refreshState()}catch{}}
function startPolling(){if(screenTimer)return;pollScreen();screenTimer=setInterval(pollScreen,900)}function stopPolling(){if(screenTimer){clearInterval(screenTimer);screenTimer=null}}
function pointFromEvent(e){const img=$('browser').querySelector('img');if(!img)return null;const r=img.getBoundingClientRect();const nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;if(nx<0||nx>1||ny<0||ny>1)return null;return{x:Math.round(nx*Number(img.dataset.w||img.naturalWidth||r.width)),y:Math.round(ny*Number(img.dataset.h||img.naturalHeight||r.height))}}
$('browser').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={x:e.clientX,y:e.clientY};$('browser').setPointerCapture?.(e.pointerId)});
$('browser').addEventListener('pointerup',async e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag=null;if(Math.abs(dx)>18||Math.abs(dy)>18){await send('scroll',{dx:Math.round(dx*2),dy:Math.round(dy*2)});return}const p=pointFromEvent(e);if(p)await send('click',p)});
$('record').onclick=()=>send('start_recording');$('stopRecord').onclick=()=>send('stop_recording');$('screenStop').onclick=()=>send('stop_screen');$('sendText').onclick=()=>{const v=$('textInput').value;if(v)send('type',{text:v})};$('enter').onclick=()=>send('key',{key:'Enter'});$('change').onclick=back;document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));load();
</script></body></html>
