<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rey Ink — Control remoto</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#09070f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:auto}header{height:62px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#100b18;border-bottom:1px solid #30223e}.logo{width:42px;height:42px;border-radius:13px;background:#7027ff;display:grid;place-items:center;font-size:23px}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:#aaa}.url{display:flex;gap:7px;padding:7px;background:#0e0a14;border-bottom:1px solid #2b2138}.url input{flex:1;min-width:0;background:#17111f;border:1px solid #3a2b4c;border-radius:11px;color:#fff;padding:10px}.url button,.bar button{border:0;border-radius:10px;background:#251a34;color:#fff;padding:10px;font-weight:800}.screen{flex:1;display:flex;align-items:center;justify-content:center;background:#05040a;overflow:hidden;touch-action:none;user-select:none;position:relative}.screen img{max-width:100%;max-height:100%;display:block;pointer-events:none}.empty{color:#aaa;text-align:center;padding:25px}.bottom{background:#100c18;border-top:1px solid #2b2138;padding:7px 8px env(safe-area-inset-bottom)}.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bar button{font-size:12px;padding:9px 3px}.bar .active{background:#7027ff}.input{display:flex;gap:6px;margin-top:6px}.input input{flex:1;background:#17111f;border:1px solid #3a2b4c;border-radius:10px;color:#fff;padding:10px}.status{text-align:center;color:#aaa;font-size:12px;padding:5px;min-height:18px}.hidden{display:none!important}#pcs{position:absolute;z-index:20;top:62px;left:0;right:0;bottom:0;background:#09070f;padding:18px;overflow:auto}.pc{width:100%;padding:15px;margin:6px 0;border-radius:14px;background:#15101d;border:1px solid #332640;color:#fff;text-align:left;font-size:16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:7px}.on{background:#35d58d}</style></head><body><div class="app"><header><div class="logo">♛</div><div><div class="brand">Rey Ink</div><div class="sub" id="sub">Selecciona una PC</div></div><button id="pcBtn" style="margin-left:auto;border:0;border-radius:999px;background:#251a34;color:#fff;padding:9px 13px;font-weight:800">PCs</button></header><div class="url"><input id="url" placeholder="https://..."><button id="go">Ir</button></div><div id="screen" class="screen"><div id="empty" class="empty">Selecciona una PC…</div></div><div class="bottom"><div class="bar"><button id="back">‹ Atrás</button><button id="forward">Adelante ›</button><button id="new">＋ Pestaña</button><button id="reload">↻ Recargar</button><button id="close">× Cerrar</button></div><div class="bar" style="margin-top:5px"><button id="clickMode" class="active">☝️ Clic</button><button id="scrollMode">↕️ Scroll</button><button id="dragMode">✋ Arrastrar</button><button id="right">🖱️ Derecho</button><button id="double">2× Clic</button></div><div class="input"><input id="text" placeholder="Escribe directamente en el navegador"><button id="send">Enviar</button><button id="enter">↵</button></div><div id="status" class="status">Esperando conexión…</div></div><div id="pcs" class="hidden"><h2>Selecciona una PC</h2><div id="pcList"></div></div></div><script>const API='/api/rey-ink';let pc=null,timer=null,mode='click',gesture=null,moved=false;const $=id=>document.getElementById(id);async function post(action,body={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,pc_slot:pc,...body}),cache:'no-store'});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok||d.ok===false)throw Error(d.error||('HTTP '+r.status));return d}async function get(action){const r=await fetch(API+'?action='+encodeURIComponent(action)+(pc?'&pc_slot='+pc:''),{cache:'no-store'});return r.json()}function say(t){$('status').textContent=t}function point(e){const img=$('screen').querySelector('img');if(!img)return null;const r=img.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;return x>=0&&x<=1&&y>=0&&y<=1?{nx:x,ny:y}:null}async function devices(){try{const d=await get('list_devices'),box=$('pcList');box.innerHTML='';for(const x of d.devices||[]){const b=document.createElement('button');b.className='pc';b.innerHTML='<b>PC '+x.pc_slot+'</b><div><span class="dot '+(x.is_online?'on':'')+'"></span>'+(x.is_online?'En línea':'Sin conexión')+'</div>';b.onclick=()=>enter(Number(x.pc_slot));box.appendChild(b)}}catch{say('⚠ No se pudo consultar las PCs')}}async function enter(n){pc=n;$('pcs').classList.add('hidden');$('pcBtn').textContent='PC'+n;$('sub').textContent='PC'+n+' · navegador remoto';say('Conectando…');try{await post('command',{command:'start_screen'});await post('command',{command:'get_state'});start()}catch(e){say('⚠ '+e.message)}}function start(){if(timer)return;poll();timer=setInterval(poll,700)}async function poll(){if(!pc)return;try{const d=await get('last_result');if(d.result?.screen){let img=$('screen').querySelector('img');if(!img){img=document.createElement('img');$('screen').appendChild(img)}if(img.src!==d.result.image)img.src=d.result.image;$('empty').classList.add('hidden');say('🟢 PC'+pc+' · navegador en vivo')}}catch{}}function modeSet(m){mode=m;for(const id of ['clickMode','scrollMode','dragMode'])$(id).classList.remove('active');$(m==='click'?'clickMode':m==='scroll'?'scrollMode':'dragMode').classList.add('active')}$('screen').addEventListener('pointerdown',e=>{if(!pc)return;e.preventDefault();gesture={x:e.clientX,y:e.clientY};moved=false;try{$('screen').setPointerCapture(e.pointerId)}catch{}});$('screen').addEventListener('pointermove',e=>{if(!gesture||mode!=='scroll')return;e.preventDefault();const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>6){moved=true;const p=point(e)||{nx:.5,ny:.5};post('command',{command:'scroll',payload:{nx:p.nx,ny:p.ny,dx:-dx*2,dy:-dy*2}}).catch(()=>{});gesture={x:e.clientX,y:e.clientY}}});$('screen').addEventListener('pointerup',async e=>{if(!gesture)return;e.preventDefault();const s=gesture;gesture=null;const p=point(e);if(!p)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;try{if(mode==='click'&&!moved)await post('command',{command:'click',payload:p});else if(mode==='drag'&&Math.hypot(dx,dy)>8){const p1=point({clientX:s.x,clientY:s.y})||p;await post('command',{command:'drag',payload:{nx1:p1.nx,ny1:p1.ny,nx2:p.nx,ny2:p.ny}})}}catch(err){say('⚠ '+err.message)}});$('screen').addEventListener('contextmenu',e=>e.preventDefault());$('clickMode').onclick=()=>modeSet('click');$('scrollMode').onclick=()=>modeSet('scroll');$('dragMode').onclick=()=>modeSet('drag');$('right').onclick=async()=>{const img=$('screen').querySelector('img');if(!img)return;const r=img.getBoundingClientRect(),p={nx:.5,ny:.5};try{await post('command',{command:'right_click',payload:p})}catch(e){say('⚠ '+e.message)}};$('double').onclick=async()=>{try{await post('command',{command:'double_click',payload:{nx:.5,ny:.5}})}catch(e){say('⚠ '+e.message)}};$('go').onclick=async()=>{let u=$('url').value.trim();if(!u)return;if(!/^https?:/i.test(u))u='https://'+u;try{await post('command',{command:'navigate',payload:{url:u}})}catch(e){say('⚠ '+e.message)}};for(const [id,command] of [['back','back'],['forward','forward'],['new','new_tab'],['reload','reload'],['close','close_tab']])$(id).onclick=()=>post('command',{command}).catch(e=>say('⚠ '+e.message));$('send').onclick=async()=>{const v=$('text').value;if(!v)return;try{await post('command',{command:'type',payload:{text:v}});$('text').value=''}catch(e){say('⚠ '+e.message)}};$('enter').onclick=()=>post('command',{command:'key',payload:{key:'Enter',code:'Enter'}}).catch(e=>say('⚠ '+e.message));$('text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('enter').click()}});$('pcBtn').onclick=async()=>{$('pcs').classList.toggle('hidden');if(!$('pcs').classList.contains('hidden'))await devices()};(async()=>{await devices();try{const d=await get('list_devices'),online=(d.devices||[]).filter(x=>x.is_online);if(online.length===1)await enter(Number(online[0].pc_slot))}catch{}})();</script></body></html>
