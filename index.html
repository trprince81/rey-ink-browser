<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink — Control Center</title><style>
:root{--bg:#070812;--panel:#101321;--line:#252a3d;--text:#f5f7ff;--muted:#8e96ab;--violet:#8b5cf6;--green:#35e39a;--red:#ff5577}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#32205c55,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1180px,94vw);margin:24px auto 50px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:950}.brand span{color:var(--violet)}.head button,.btn{border:1px solid var(--line);background:#151a29;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.hero{padding:22px;border:1px solid var(--line);border-radius:20px;background:#0d101be8;box-shadow:0 20px 70px #0006}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#121726;border:1px solid var(--line);color:#aab2c7;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.tab.active{background:#2a1a4c;border-color:#7047bd;color:#fff}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0a0d16;border:1px solid var(--line);border-radius:15px;padding:15px}.k{font-size:10px;color:var(--muted);letter-spacing:.8px}.v{font-size:25px;font-weight:950;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.input,.select{background:#0a0d16;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;min-width:190px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #202538}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#697186;margin-right:6px}.on{background:var(--green);box-shadow:0 0 10px #35e39a88}.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#202638;font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}.modal.show{display:grid}.dialog{width:min(520px,96vw);background:#0d101a;border:1px solid #353b54;border-radius:18px;padding:20px}.dialog h2{margin-top:0}.fields{display:grid;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.linkbox{margin-top:12px;padding:12px;border:1px solid #35405b;border-radius:10px;background:#090c14;word-break:break-all}.notice{margin:10px 0;color:#ffbf6b;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.input,.select{width:100%}}
</style></head><body><main class="wrap"><div class="head"><div class="brand">👑 Rey <span>Ink</span></div><button id="keyBtn">🔐 Clave de administrador</button></div><div class="hero"><div class="tabs"><button class="tab active" data-tab="home">Resumen</button><button class="tab" data-tab="pcs">PCs</button><button class="tab" data-tab="licenses">Licencias</button><button class="tab" data-tab="links">Links clientes</button></div>
<section id="home" class="section active"><div class="grid"><div class="card"><div class="k">PCS</div><div id="npcs" class="v">—</div></div><div class="card"><div class="k">EN LÍNEA</div><div id="online" class="v">—</div></div><div class="card"><div class="k">LICENCIAS ACTIVAS</div><div id="active" class="v">—</div></div><div class="card"><div class="k">PLANES</div><div id="plansN" class="v">—</div></div></div><div class="toolbar"><button class="btn" onclick="refresh()">↻ Actualizar</button><button class="btn" onclick="openLicense()">＋ Nueva licencia</button></div><div class="notice">Este centro es para administración. La extensión estable no se modifica desde aquí.</div></section>
<section id="pcs" class="section"><h2>PCs asignables</h2><div id="pcsTable"></div></section>
<section id="licenses" class="section"><div class="toolbar"><button class="btn" onclick="openLicense()">＋ Crear licencia</button></div><div id="licensesTable"></div></section>
<section id="links" class="section"><h2>Generar link de cliente</h2><p style="color:var(--muted)">Selecciona una PC y genera un link individual para que el cliente pueda entrar a su panel.</p><div class="toolbar"><select id="linkDevice" class="select"></select><input id="linkLabel" class="input" placeholder="Nombre del cliente"><button class="btn" onclick="createLink()">🔗 Generar link</button></div><div id="linkResult"></div></section>
</div></main>
<div id="modal" class="modal"><div class="dialog"><h2>Nueva licencia</h2><div class="fields"><input id="client" class="input" placeholder="Nombre del cliente"><select id="plan" class="select"></select></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn" onclick="createLicense()">Crear</button></div></div></div>
<script>
const API='/api/admin';let data={devices:[],licenses:[],plans:[]};const $=id=>document.getElementById(id);function key(){return localStorage.getItem('reyink_admin_key')||''}function headers(){return {'x-admin-key':key()}}async function api(a,b){const r=await fetch(API+(a==='overview'?'?action=overview':''),{method:b?'POST':'GET',headers:b?{'content-type':'application/json',...headers()}:headers(),body:b?JSON.stringify(b):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
async function refresh(){try{if(!key()){setKey();return}data=await api('overview');render()}catch(e){alert(e.message)}}function render(){const ds=data.devices||[],ls=data.licenses||[],ps=data.plans||[];$('npcs').textContent=ds.length;$('online').textContent=ds.filter(x=>x.is_online).length;$('active').textContent=ls.filter(x=>x.status==='active').length;$('plansN').textContent=ps.length;$('pcsTable').innerHTML='<table class="table"><thead><tr><th>PC</th><th>Estado</th><th>Último contacto</th><th>Bot</th></tr></thead><tbody>'+ds.map(x=>`<tr><td><b>${esc(x.device_code)}</b><br><small>${esc(x.name)}</small></td><td><span class="dot ${x.is_online?'on':''}"></span>${x.is_online?'En línea':'Offline'}</td><td>${x.last_seen_at?new Date(x.last_seen_at).toLocaleString():'—'}</td><td>${x.updater_running?'ACTIVO':'DETENIDO'}</td></tr>`).join('')+'</tbody></table>';$('licensesTable').innerHTML='<table class="table"><thead><tr><th>Cliente</th><th>Licencia</th><th>Plan</th><th>Estado</th><th>Vence</th><th>PC</th></tr></thead><tbody>'+ls.map(x=>`<tr><td><b>${esc(x.client_name)}</b></td><td>${esc(x.license_key)}</td><td>${esc((ps.find(p=>p.id===x.plan_id)||{}).name||'—')}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.expires_at?new Date(x.expires_at).toLocaleDateString():'—'}</td><td><select class="select" style="min-width:120px" onchange="assign('${x.id}',this.value)"><option value="">Sin asignar</option>${ds.map(d=>`<option value="${d.id}" ${x.device_id===d.id?'selected':''}>${esc(d.device_code)}</option>`).join('')}</select></td></tr>`).join('')+'</tbody></table>';$('linkDevice').innerHTML=ds.map(d=>`<option value="${d.id}">${esc(d.device_code)} — ${esc(d.name)}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setKey(){const k=prompt('Introduce la clave privada de administrador de Rey Ink');if(k!==null){localStorage.setItem('reyink_admin_key',k);refresh()}}$('keyBtn').onclick=setKey;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});function openLicense(){$('plan').innerHTML=data.plans.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.duration_days} días</option>`).join('');$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}async function createLicense(){try{const j=await api('x',{action:'create_license',client_name:$('client').value,plan_id:$('plan').value});closeModal();$('client').value='';alert('Licencia creada: '+j.license.license_key);refresh()}catch(e){alert(e.message)}}async function assign(id,device_id){if(!device_id)return;try{await api('x',{action:'assign_device',license_id:id,device_id});refresh()}catch(e){alert(e.message)}}async function createLink(){try{const j=await api('x',{action:'create_link',device_id:$('linkDevice').value,label:$('linkLabel').value||'Cliente',base_url:location.origin});$('linkResult').innerHTML='<div class="linkbox"><b>Link generado:</b><br>'+esc(j.link)+'<br><br><button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(j.link)+');this.textContent=\'Copiado ✓\'">Copiar</button></div>';$('linkLabel').value=''}catch(e){alert(e.message)}}refresh();
</script></body></html>
