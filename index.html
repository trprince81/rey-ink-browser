<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070f"><title>Rey Ink — Navegador remoto</title><style>*{box-sizing:border-box}html,body{margin:0;background:#09070f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100%}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#100c18;border-bottom:1px solid #2b2138}.logo{width:42px;height:42px;border-radius:13px;background:#7027ff;display:grid;place-items:center;font-size:22px}.brand{font-weight:850;font-size:20px}.sub{font-size:12px;color:#a9a0b4}.pcpick{margin-left:auto;background:#20162e;border:1px solid #3a2b4c;color:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.urlbar{display:flex;gap:7px;padding:8px;background:#0e0a14;border-bottom:1px solid #2b2138}.urlbar input{flex:1;min-width:0;background:#17111f;border:1px solid #3a2b4c;border-radius:12px;color:#fff;padding:10px 12px;font-size:15px}.urlbar button,.toolbar button{border:0;border-radius:11px;background:#251a34;color:#fff;padding:10px 13px;font-weight:750}.screen{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#05040a;overflow:hidden;touch-action:none;user-select:none}.screen img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;pointer-events:none}.empty{color:#aaa0b4;text-align:center;padding:30px}.bottom{background:#100c18;border-top:1px solid #2b2138;padding:7px 8px env(safe-area-inset-bottom);}.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.toolbar button{font-size:12px;padding:9px 4px}.toolbar .primary{background:#7027ff}.keyboard{display:flex;gap:6px;margin-top:7px}.keyboard input{flex:1;background:#17111f;border:1px solid #3a2b4c;border-radius:11px;color:#fff;padding:10px}.keyboard button{background:#f2eef7;color:#111;border:0;border-radius:11px;padding:0 15px;font-weight:800}.pcs{position:absolute;inset:64px 0 0;background:#09070f;padding:18px;overflow:auto;z-index:10}.pcs h2{margin:4px 0 14px}.pc{width:100%;margin:7px 0;padding:15px;background:#15101d;border:1px solid #332640;color:#fff;border-radius:14px;text-align:left;font-size:16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:7px}.on{background:#35d58d}.hidden{display:none!important}.status{font-size:12px;color:#aaa0b4;padding:4px 10px;text-align:center}.hint{font-size:11px;color:#8f859b;text-align:center;margin-top:5px}@media(min-width:800px){.app{max-width:1200px;margin:auto;border-left:1px solid #2b2138;border-right:1px solid #2b2138}.screen img{max-height:calc(100dvh - 170px)}} </style></head><body><div class="app"><header class="top"><div class="logo">♛</div><div><div class="brand">Rey Ink</div><div class="sub" id="sub">Navegador remoto</div></div><button class="pcpick" id="pcBtn">PCs</button></header><div class="urlbar"><input id="url" placeholder="Escribe una dirección…"><button id="go">Ir</button></div><main class="screen" id="screen"><div class="empty" id="empty">Conectando con el navegador…</div></main><div class="bottom"><div class="toolbar"><button id="back">‹ Atrás</button><button id="forward">Adelante ›</button><button id="new">＋ Pestaña</button><button id="reload">↻ Recargar</button><button id="close">× Cerrar</button></div><div class="keyboard"><input id="text" placeholder="Escribe directamente en el navegador"><button id="send">Enviar</button><button id="enter">↵</button></div><div class="status" id="status">Preparando control…</div><div class="hint">Toca para hacer clic · desliza para desplazarte · arrastra para mover elementos</div></div><section class="pcs hidden" id="pcs"><h2>Selecciona una PC</h2><div id="pcList"></div></section></div><script>
const API='/api/rey-ink';let pc=null,timer=null,drag=null;const $=x=>document.getElementById(x);async function req(action,body={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,pc_slot:pc,...body}),cache:'no-store'});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||('HTTP '+r.status));return d}async function get(action,extra=''){const r=await fetch(API+'?action='+action+extra,{cache:'no-store'});return r.json()}async function list(){try{const d=await get('list_devices'),box=$('pcList');box.innerHTML='';for(const x of d.devices||[]){const b=document.createElement('button');b.className='pc';b.innerHTML='<b>PC '+x.pc_slot+'</b><div><span class="dot '+(x.is_online?'on':'')+'"></span>'+(x.is_online?'En línea':'Sin conexión')+'</div>';b.onclick=()=>enter(Number(x.pc_slot));box.appendChild(b)}}catch{}}async function enter(n){pc=n;$('pcs').classList.add('hidden');$('pcBtn').textContent='PC'+n;$('status').textContent='Conectando…';try{await req('command',{command:'start_screen'});const s=await req('command',{command:'get_state'});$('url').value=s.url||'';$('sub').textContent='PC'+n+' · navegador remoto';$('status').textContent='🟢 Control conectado';start()}catch(e){$('status').textContent='⚠ '+e.message}}function start(){if(timer)return;poll();timer=setInterval(poll,650)}async function poll(){if(!pc)return;try{const d=await get('last_result','&pc_slot='+pc);if(d.result?.screen){const img=$('screen').querySelector('img')||document.createElement('img');if(!img.parentNode)$('screen').appendChild(img);img.src=d.result.image;$('empty').classList.add('hidden');$('status').textContent='🟢 PC'+pc+' · navegador controlable'}}catch{}}function point(e){const img=$('screen').querySelector('img');if(!img)return null;const r=img.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;return x>=0&&x<=1&&y>=0&&y<=1?{nx:x,ny:y}:null}$('screen').addEventListener('pointerdown',e=>{e.preventDefault();drag={x:e.clientX,y:e.clientY,id:e.pointerId};try{$('screen').setPointerCapture(e.pointerId)}catch{}});$('screen').addEventListener('pointerup',async e=>{if(!drag)return;e.preventDefault();const a=drag;drag=null;const dx=e.clientX-a.x,dy=e.clientY-a.y;if(Math.hypot(dx,dy)>14){const p1=point({clientX:a.x,clientY:a.y}),p2=point(e);if(p1&&p2)await req('command',{command:'drag',payload:{nx1:p1.nx,ny1:p1.ny,nx2:p2.nx,ny2:p2.ny}})}else{const p=point(e);if(p)await req('command',{command:'click',payload:p})}});let lastMove=0;$('screen').addEventListener('pointermove',e=>{if(!drag||Date.now()-lastMove<70)return;lastMove=Date.now();const p=point(e);if(p&&Math.abs(e.movementY)>2)req('command',{command:'scroll',payload:{nx:p.nx,ny:p.ny,dy:-e.movementY*6,dx:-e.movementX*2}}).catch(()=>{})});$('go').onclick=()=>{const u=$('url').value.trim();if(u)req('command',{command:'navigate',payload:{url:u}})};$('back').onclick=()=>req('command',{command:'back'});$('forward').onclick=()=>req('command',{command:'forward'});$('new').onclick=()=>req('command',{command:'new_tab'});$('reload').onclick=()=>req('command',{command:'reload'});$('close').onclick=()=>req('command',{command:'close_tab'});$('send').onclick=()=>{const v=$('text').value;if(v)req('command',{command:'type',payload:{text:v}})};$('enter').onclick=()=>req('command',{command:'key',payload:{key:'Enter',code:'Enter'}});$('text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('enter').click()}});$('pcBtn').onclick=async()=>{$('pcs').classList.remove('hidden');await list()};list().then(async()=>{try{const d=await get('list_devices');const online=(d.devices||[]).filter(x=>x.is_online);if(online.length===1)enter(Number(online[0].pc_slot))}catch{}});
</script></body></html>
