<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey Ink</title><style>body{margin:0;background:#08060f;color:#f7f4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:15px;background:#7027ff;display:grid;place-items:center;font-size:25px}.title{font-size:27px;font-weight:800}.muted{color:#aaa2b8;font-size:13px}.card{background:#15111f;border:1px solid #302541;border-radius:18px;padding:17px;margin:12px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.pc{border:1px solid #382a4d;background:#0f0b17;color:#fff;border-radius:13px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b6472;margin-right:7px}.on{background:#35d58d}.hidden{display:none}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#0e0a16;color:#c9c1d7;font-size:13px}.err{color:#ff8f9a}.ok{color:#68e2a6}.browser{margin-top:14px;border:1px solid #302541;border-radius:14px;min-height:360px;background:#0b0811;display:grid;place-items:center;color:#aaa2b8;text-align:center;padding:25px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{border:0;border-radius:10px;padding:10px 12px;background:#21172f;color:#fff;font-weight:700;cursor:pointer}.danger{background:#a62b42!important}.badge{padding:5px 9px;border-radius:999px;background:#21172f;font-size:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}.browser{min-height:260px}}</style></head><body><main class="wrap"><div class="brand"><div class="logo">♛</div><div><div class="title">Rey Ink</div><div class="muted">Tus PCs, desde el celular</div></div></div><section id="listCard" class="card"><div class="topline"><h2>PCs disponibles</h2><span class="badge" id="status">Comprobando…</span></div><div class="msg" id="message">Conectando con Rey Ink…</div><div class="grid" id="pcs"></div></section><section id="controlCard" class="card hidden"><div class="topline"><div><h2 id="ctrlTitle">PC1</h2><div class="muted" id="connection">Comprobando…</div></div><button id="change">Cambiar PC</button></div><div class="browser"><div><strong>Navegador de PC</strong><span>La vista de la PC aparecerá aquí cuando el canal de pantalla esté activo.</span></div></div><div class="msg" id="result">Listo.</div><div class="row"><button data-cmd="get_state">Estado</button><button data-cmd="reload">Recargar</button><button data-cmd="back">Atrás</button><button data-cmd="forward">Adelante</button><button data-cmd="new_tab">Nueva pestaña</button><button data-cmd="start_bot">Iniciar bot</button><button class="danger" data-cmd="stop_bot">Detener bot</button></div></section></main><script>const API='/api/rey-ink';let selected=null,loading=false;async function apiGet(action){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(API+'?action='+encodeURIComponent(action),{cache:'no-store',signal:c.signal});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}finally{clearTimeout(t)}}async function api(body){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store',signal:c.signal});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}finally{clearTimeout(t)}}function show(id){document.getElementById(id).classList.remove('hidden')}function hide(id){document.getElementById(id).classList.add('hidden')}async function load(){if(loading)return;loading=true;const box=document.getElementById('pcs');try{const d=await apiGet('list_devices');box.innerHTML='';for(let n=1;n<=20;n++){const x=(d.devices||[]).find(v=>Number(v.pc_slot)===n),b=document.createElement('button');b.className='pc';b.innerHTML='<b>PC '+n+'</b><div class="muted"><span class="dot '+(x&&x.is_online?'on':'')+'"></span>'+(x&&x.is_online?'En línea':'Sin conexión')+'</div>';b.onclick=()=>selectPc(n);box.appendChild(b)}document.getElementById('status').textContent='Conectado';document.getElementById('message').className='msg ok';document.getElementById('message').textContent='Rey Ink está listo. Selecciona una PC.'}catch(e){document.getElementById('status').textContent='Sin conexión';document.getElementById('message').className='msg err';document.getElementById('message').textContent=(e.name==='AbortError'?'Vercel no respondió en 8 segundos.':e.message);box.innerHTML=''}finally{loading=false}}function selectPc(n){selected=n;hide('listCard');show('controlCard');document.getElementById('ctrlTitle').textContent='PC'+n;refreshState()}function back(){hide('controlCard');show('listCard');selected=null}async function refreshState(){if(!selected)return;try{const d=await api({action:'get_state',pc_slot:selected});document.getElementById('connection').textContent=d.ok&&d.is_online?'🟢 En línea':'🔴 Sin conexión'}catch(e){document.getElementById('connection').textContent='⚠️ '+e.message}}async function send(command){if(!selected)return;try{const r=await api({action:'command',pc_slot:selected,command});document.getElementById('result').textContent=r.ok?'Orden enviada: '+command:(r.error||'Error')}catch(e){document.getElementById('result').textContent=e.message}}document.getElementById('change').onclick=back;document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));load();setInterval(load,5000);</script></body></html>
