<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rey Ink</title><style>html,body{margin:0;height:100%;background:#07050b;color:#fff;font-family:system-ui}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.h{height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#100b18}.logo{width:40px;height:40px;border-radius:12px;background:#7027ff;display:grid;place-items:center}.brand{font-weight:900}.status{margin-left:auto;color:#aaa;font-size:12px}.screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;touch-action:none}.screen video{max-width:100%;max-height:100%;display:block}.pcs{position:absolute;inset:58px 0 0;background:#09070f;padding:16px;z-index:4}.pc{display:block;width:100%;padding:15px;margin:7px 0;background:#15101d;border:1px solid #352645;border-radius:14px;color:#fff;text-align:left}.bar{padding:7px;background:#100b18;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bar button{border:0;border-radius:9px;background:#251a34;color:#fff;padding:9px 2px}.input{display:flex;gap:5px;padding:6px;background:#100b18}.input input{flex:1;background:#17111f;border:1px solid #392a4a;color:#fff;border-radius:9px;padding:9px}.hidden{display:none!important}</style></head><body><div class="app"><div class="h"><div class="logo">♛</div><div class="brand">Rey Ink</div><div id="st" class="status">Selecciona una PC</div></div><div id="screen" class="screen"><video id="v" autoplay playsinline></video></div><div class="bar"><button id="back">‹ Atrás</button><button id="forward">Adelante ›</button><button id="reload">↻ Recargar</button><button id="new">＋ Pestaña</button><button id="pcsbtn">PCs</button></div><div class="input"><input id="txt" placeholder="Escribe en Chrome"><button id="send">Enviar</button><button id="enter">↵</button></div><div id="pcs" class="pcs hidden"><h2>Selecciona una PC</h2><div id="list"></div></div></div><script>
const API='/api/rey-ink';let pc=null,dc=null,slot=null,session=null,down=null;const $=x=>document.getElementById(x),sleep=m=>new Promise(r=>setTimeout(r,m));
async function get(a){return(await fetch(API+'?action='+a+(slot?'&pc_slot='+slot:'')+(session?'&session='+encodeURIComponent(session):''),{cache:'no-store'})).json()}
async function post(a,b){return(await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:a,pc_slot:slot,session,...b})})).json()}
async function list(){const d=await get('list_devices');$('list').innerHTML='';for(const x of d.devices||[]){const b=document.createElement('button');b.className='pc';b.innerHTML='<b>PC '+x.pc_slot+'</b><br><small>'+(x.is_online?'🟢 En línea':'⚪ Desconectada')+'</small>';b.onclick=()=>connect(x);$('list').appendChild(b)}}
async function waitIce(){if(pc.iceGatheringState==='complete')return;await new Promise(resolve=>{const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);resolve()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(resolve,8000)})}
async function connect(x){slot=x.pc_slot;session=x.session_id;$('pcs').classList.add('hidden');$('st').textContent='Conectando PC'+slot+'…';if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});pc.ontrack=e=>{$('v').srcObject=e.streams[0]};pc.ondatachannel=e=>{dc=e.channel;dc.onopen=()=>{$('st').textContent='🟢 PC'+slot+' · CONTROL REAL'}};pc.onconnectionstatechange=()=>{if(pc.connectionState!=='connected')$('st').textContent='PC'+slot+' · '+pc.connectionState};let d=null;for(let i=0;i<20;i++){d=await get('webrtc_offer');if(d.offer)break;await sleep(500)}if(!d?.offer){$('st').textContent='PC aún no está transmitiendo';return}await pc.setRemoteDescription(d.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await waitIce();await post('webrtc_answer',{answer:pc.localDescription});}
function send(e){if(dc?.readyState==='open')dc.send(JSON.stringify(e))}
$('screen').addEventListener('pointerdown',e=>{const r=$('v').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;down={x:e.clientX,y:e.clientY};send({type:'mouse',action:'down',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,button:e.button===2?'right':'left',clickCount:1});e.preventDefault()});$('screen').addEventListener('pointerup',e=>{const r=$('v').getBoundingClientRect();if(!down)return;send({type:'mouse',action:'up',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,button:e.button===2?'right':'left',clickCount:1});down=null;e.preventDefault()});$('screen').addEventListener('wheel',e=>{const r=$('v').getBoundingClientRect();send({type:'mouse',action:'wheel',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,dx:e.deltaX,dy:e.deltaY});e.preventDefault()},{passive:false});$('send').onclick=()=>{if($('txt').value){send({type:'type',text:$('txt').value});$('txt').value=''}};$('enter').onclick=()=>send({type:'key',key:'Enter',code:'Enter'});$('txt').onkeydown=e=>{if(e.key==='Enter'){$('enter').click();e.preventDefault()}};for(const [id,c] of [['back','back'],['forward','forward'],['reload','reload'],['new','new_tab']])$(id).onclick=()=>post('command',{command:c});$('pcsbtn').onclick=async()=>{$('pcs').classList.toggle('hidden');if(!$('pcs').classList.contains('hidden'))await list()};list();
</script></body></html>
