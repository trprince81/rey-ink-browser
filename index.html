<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rey ink — Control Center</title>
<style>
:root{--bg:#05060b;--panel:#0d1019;--line:#292d42;--text:#f7f8ff;--muted:#858aa3;--violet:#8b5cf6;--cyan:#35d7ff;--green:#42f5a7;--red:#ff5275}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -5%,#392071 0,transparent 34%),radial-gradient(circle at 0 20%,#10334c 0,transparent 27%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:24px 16px;border-right:1px solid #1b1e2b;background:#070810cc;backdrop-filter:blur(18px)}.brand{display:flex;gap:11px;align-items:center;margin-bottom:30px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#a855f7,#4f46e5);box-shadow:0 0 30px #7448ff66;font-size:24px}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.4px;margin-top:2px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#aeb3c8;border:1px solid transparent;text-align:left;padding:12px;border-radius:11px;cursor:pointer}.nav button.active,.nav button:hover{background:#171624;border-color:#302b4b;color:#fff}.main{padding:30px;max-width:1350px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{font-size:30px;margin:0}.top p{margin:6px 0 0;color:var(--muted)}.pill{padding:8px 12px;border:1px solid #29334c;background:#0e1420;border-radius:999px;color:#aeb8d0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#111522ee,#090b12ed);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 16px 38px #0006,inset 0 1px #ffffff0b}.k{color:var(--muted);font-size:10px;letter-spacing:.8px}.v{font-size:27px;font-weight:850;margin-top:7px}.ok{color:var(--green)}.devices{margin-top:15px}.device{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:16px 0;border-top:1px solid #202437}.device:first-of-type{border-top:0}.name{font-weight:800;font-size:15px}.meta{color:var(--muted);font-size:11px;margin-top:5px}.actions{display:flex;gap:8px}.btn{border:1px solid #34394e;background:#151927;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn:hover{border-color:#7559d5}.primary{background:linear-gradient(135deg,#8b5cf6,#5b21b6);border:0}.empty{text-align:center;padding:34px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10}.modal.show{display:grid}.dialog{width:min(430px,92vw);background:#0c0f19;border:1px solid #353a55;border-radius:20px;padding:20px;box-shadow:0 25px 70px #000b}.dialog h2{margin:0 0 5px}.dialog p{color:var(--muted);font-size:12px}.field{width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #34394e;background:#080a11;color:white;outline:none}.field:focus{border-color:#7c5de8}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.device{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">♛</div><div><b>Rey ink</b><small>CONTROL CENTER</small></div></div><nav class="nav"><button class="active">⌂ Dashboard</button><button onclick="location.href='#devices'">◉ Dispositivos</button><button onclick="alert('Módulo de Posts: siguiente fase')">▣ Posts</button><button onclick="alert('Módulo de Actividad: siguiente fase')">◌ Actividad</button><button onclick="alert('Configuración: siguiente fase')">⚙ Configuración</button></nav></aside><main class="main"><div class="top"><div><h1>Dashboard</h1><p>Tu centro de control para Rey ink</p></div><div class="pill">● <span id="apiState">Conectando…</span></div></div><section class="grid"><div class="card"><div class="k">DISPOSITIVOS</div><div id="total" class="v">—</div></div><div class="card"><div class="k">EN LÍNEA</div><div id="online" class="v ok">—</div></div><div class="card"><div class="k">ACTUALIZADORES</div><div id="running" class="v">—</div></div><div class="card"><div class="k">ÚLTIMO BUMP</div><div id="last" class="v">—</div></div></section><section id="devices" class="card devices"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><b>Mis dispositivos</b><button class="btn primary" id="add">＋ Agregar dispositivo</button></div><div id="list" class="empty">Cargando dispositivos…</div></section></main></div><div id="modal" class="modal"><div class="dialog"><h2>Agregar dispositivo</h2><p>Primera fase: crear un dispositivo independiente y generar su enlace privado.</p><input id="name" class="field" placeholder="Nombre, ejemplo: PC-01"><select id="type" class="field"><option value="pc">PC</option><option value="phone">Teléfono</option></select><input id="key" class="field" type="password" placeholder="Clave del panel (REY_INK_ADMIN_KEY)"><div class="row"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Crear dispositivo</button></div></div></div>
<script>
const $=id=>document.getElementById(id); const savedKey=localStorage.getItem('reyInkAdminKey')||''; $('key').value=savedKey;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{const r=await fetch('/api/devices',{headers:{'x-rey-ink-key':localStorage.getItem('reyInkAdminKey')||''}});const j=await r.json();if(!r.ok)throw Error(j.error||'API');$('apiState').textContent='Conectado';$('total').textContent=j.stats.total;$('online').textContent=j.stats.online;$('running').textContent=j.stats.running;$('last').textContent=j.stats.lastBump||'—';$('list').innerHTML=j.devices.length?j.devices.map(d=>`<div class="device"><div><div class="name">${esc(d.name)} <span style="font-size:10px;color:${d.is_online?'#42f5a7':'#777'}">● ${d.is_online?'EN LÍNEA':'OFFLINE'}</span></div><div class="meta">${esc(d.device_code)} · ${esc(d.device_type)} · ${d.updater_running?'Actualizador activo':'Detenido'}</div></div><div class="actions"><button class="btn" onclick="copyLink('${esc(d.control_url)}')">Copiar link</button><button class="btn primary" onclick="location.href='${esc(d.control_url)}'">Control</button></div></div>`).join(''):'<div class="empty">Aún no hay dispositivos. Pulsa “Agregar dispositivo”.</div>'}catch(e){$('apiState').textContent='API pendiente';$('list').innerHTML='<div class="empty">La interfaz está lista. Configura REY_INK_ADMIN_KEY, SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY en Vercel para activar los datos reales.</div>'}}
function copyLink(x){navigator.clipboard?.writeText(x);alert('Link copiado: '+x)}
$('add').onclick=()=>{$('modal').classList.add('show')};$('cancel').onclick=()=>{$('modal').classList.remove('show')};$('save').onclick=async()=>{const key=$('key').value.trim();if(!key)return alert('Escribe la clave del panel.');localStorage.setItem('reyInkAdminKey',key);const r=await fetch('/api/devices',{method:'POST',headers:{'content-type':'application/json','x-rey-ink-key':key},body:JSON.stringify({name:$('name').value.trim()||'Nuevo dispositivo',device_type:$('type').value})});const j=await r.json();if(!r.ok)return alert(j.error||'No se pudo crear');$('modal').classList.remove('show');if(j.control_url)alert('Dispositivo creado. Link privado:\n\n'+j.control_url);load()};load();setInterval(load,15000);
</script></body></html>
