<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutant — Generador de Licencias</title><style>:root{--g:#39ff88;--bg:#050806;--panel:rgba(10,18,13,.68);--line:#1c3b28;--muted:#81958a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#12351f 0,#050806 38%,#020302 100%);color:#f4fff7;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(920px,92vw);margin:0 auto;padding:45px 0}.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.logo{width:58px;height:58px;border:1px solid #347b50;border-radius:16px;display:grid;place-items:center;background:#09120c;box-shadow:0 0 35px #39ff8820}.logo svg{width:38px}.name{font-size:31px;font-weight:950;letter-spacing:.5px}.name span{color:var(--g);text-shadow:0 0 20px #39ff8866}.sub{color:var(--muted);margin-top:3px}.panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(18px);padding:25px;box-shadow:0 30px 90px #0008}.title{font-size:22px;font-weight:900;margin-bottom:5px}.hint{color:var(--muted);margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#a9bdb0;font-weight:800;text-transform:uppercase;letter-spacing:.8px}.input,.select{width:100%;border:1px solid #294c35;border-radius:12px;background:#07100a;color:#fff;padding:13px;outline:none;font-size:15px}.input:focus,.select:focus{border-color:var(--g);box-shadow:0 0 0 3px #39ff8815}.full{grid-column:1/-1}.btn{margin-top:18px;width:100%;border:1px solid #36b96b;border-radius:13px;padding:14px;background:linear-gradient(180deg,#153a24,#0c2115);color:#eafff0;font-weight:950;font-size:15px;cursor:pointer;box-shadow:0 0 25px #39ff8815}.btn:hover{box-shadow:0 0 35px #39ff8830}.btn:disabled{opacity:.55;cursor:wait}.status{min-height:22px;margin-top:15px;color:var(--muted)}.result{display:none;margin-top:20px;border:1px solid #347b50;border-radius:16px;padding:18px;background:#061009}.result.open{display:block}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #173021}.row:last-child{border-bottom:0}.key{margin:15px 0;padding:16px;border:1px solid #347b50;border-radius:12px;background:#020603;color:var(--g);font-size:20px;font-weight:950;letter-spacing:1.5px;word-break:break-all;text-align:center}.copy{border:1px solid #2d5c3e;background:#102318;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.back{display:inline-block;margin-top:18px;color:var(--muted);text-decoration:none}.back:hover{color:var(--g)}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:25px 0}.name{font-size:25px}}</style></head><body><main class="wrap"><header class="brand"><div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M8 50V14h9l15 20 15-20h9v36h-9V29L32 49 17 29v21H8Z" fill="#39ff88"/><path d="M25 14h14l-7 10-7-10Z" fill="#d9ffe9"/></svg></div><div><div class="name">MUT<span>ANT</span></div><div class="sub">Generador oficial de licencias</div></div></header><section class="panel"><div class="title">Nueva licencia</div><div class="hint">Escribe el correo, elige el plan y genera. No necesitas ninguna clave administrativa.</div><div class="grid"><div class="field full"><label>Correo del cliente</label><input id="email" class="input" type="email" autocomplete="email" placeholder="cliente@gmail.com"></div><div class="field full"><label>Plan de Mutant</label><select id="plan" class="select"><option value="">Cargando planes…</option></select></div></div><button id="generate" class="btn">⚡ GENERAR LICENCIA</button><div id="status" class="status"></div><div id="result" class="result"><div class="title">Licencia generada correctamente</div><div class="key" id="key">—</div><button class="copy" id="copy">Copiar licencia</button><div class="row"><span>Programa</span><b>Mutant</b></div><div class="row"><span>Correo</span><b id="rEmail">—</b></div><div class="row"><span>Plan</span><b id="rPlan">—</b></div><div class="row"><span>Perfiles</span><b id="rProfiles">—</b></div><div class="row"><span>Estado</span><b id="rStatus">ACTIVA</b></div><div class="row"><span>Expira</span><b id="rExpires">—</b></div></div><a class="back" href="/">← Volver a Rey Ink</a></section></main><script>const $=id=>document.getElementById(id),API='/api/license-generate.js';let plans=[];async function loadPlans(){try{const r=await fetch('/api/mutante-license-admin.js?limit=1',{cache:'no-store'});const j=await r.json();if(j.ok&&j.plans?.length){plans=j.plans.filter(p=>String(p.status).toLowerCase()==='active'&&Number(p.duration_days)===30&&[5,10,35,50,100,500,1000].includes(Number(p.max_profiles))).sort((a,b)=>Number(a.max_profiles)-Number(b.max_profiles));}else throw Error()}catch(_){plans=[]}const prices={5:13,10:20,35:30,50:50,100:70,500:150,1000:350};const names={5:'Especial',10:'Básico',35:'Pro',50:'Plus',100:'Business',500:'Enterprise',1000:'Max'};$('plan').innerHTML='<option value="">Selecciona un plan</option>'+plans.map(p=>{const n=Number(p.max_profiles);return `<option value="${p.id}">${names[n]||p.name} · ${n.toLocaleString()} perfiles · $${prices[n]}/mes</option>`}).join('');if(!plans.length)$('status').textContent='No se pudieron cargar los planes.'}async function generate(){const email=$('email').value.trim().toLowerCase(),plan_id=$('plan').value;if(!/^\S+@\S+\.\S+$/.test(email))return $('status').textContent='Escribe un correo válido.';if(!plan_id)return $('status').textContent='Selecciona un plan.';$('generate').disabled=true;$('status').textContent='Generando licencia…';$('result').classList.remove('open');try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,plan_id}),cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudo generar la licencia');$('key').textContent=j.license.key;$('rEmail').textContent=j.license.email;$('rPlan').textContent=j.license.plan_name||'—';$('rProfiles').textContent=Number(j.license.max_profiles).toLocaleString();$('rStatus').textContent='ACTIVA';$('rExpires').textContent=new Date(j.license.expires_at).toLocaleString();$('result').classList.add('open');$('status').textContent='✓ Licencia guardada y lista para usar en Mutant.'}catch(e){$('status').textContent=e.message||'Error del servidor'}finally{$('generate').disabled=false}}$('generate').onclick=generate;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('key').textContent);$('copy').textContent='✓ Copiada'}catch(_){prompt('Copia la licencia:',$('key').textContent)}};loadPlans();</script></body></html>
