<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUTANT — Generador Interno</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050706;color:#fff;font-family:Inter,system-ui,Arial;display:flex;align-items:center;justify-content:center;padding:24px}.app{width:min(1050px,100%);background:linear-gradient(145deg,#101612,#070907);border:1px solid #1aff75;border-radius:24px;box-shadow:0 0 55px #00ff6630, inset 0 0 50px #00ff6610;overflow:hidden}.top{padding:26px 30px;border-bottom:1px solid #173b25;display:flex;align-items:center;gap:16px}.logo{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;border:1px solid #1aff75;background:#07130b;font-weight:900;font-size:28px;color:#1aff75;box-shadow:0 0 25px #00ff6630}.brand b{font-size:25px;letter-spacing:4px}.brand span{display:block;color:#7cffaa;font-size:12px;letter-spacing:2px;margin-top:4px}.main{padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#0a100c;border:1px solid #183c27;border-radius:18px;padding:24px}.panel h2{margin:0 0 20px;font-size:18px}.field{margin:16px 0}.field label{display:block;font-size:12px;color:#7cffaa;margin-bottom:8px;text-transform:uppercase;letter-spacing:1.5px}input,select{width:100%;padding:15px;border-radius:11px;border:1px solid #275b3a;background:#050805;color:#fff;outline:none;font-size:15px}input:focus,select:focus{border-color:#1aff75;box-shadow:0 0 0 3px #1aff7512}.generate{width:100%;padding:16px;border:0;border-radius:11px;background:#16e86b;color:#001b0b;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px}.generate:hover{filter:brightness(1.1)}.result{min-height:100%;display:flex;flex-direction:column;justify-content:center}.empty{color:#62816c;text-align:center;padding:35px}.key{font-size:19px;letter-spacing:1px;background:#050805;border:1px dashed #1aff75;border-radius:12px;padding:16px;word-break:break-all;color:#5dff9a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{padding:13px;background:#080d09;border-radius:10px;border:1px solid #153520}.stat small{display:block;color:#6d9278;font-size:10px;text-transform:uppercase}.stat b{display:block;margin-top:5px;font-size:13px}.copy{margin-top:12px;width:100%;padding:12px;border:1px solid #1aff75;background:transparent;color:#7cffaa;border-radius:10px;cursor:pointer}.status{margin-top:14px;color:#65ff9d;font-size:12px;text-align:center;min-height:18px}@media(max-width:760px){.main{grid-template-columns:1fr;padding:18px}.top{padding:20px}.app{border-radius:18px}}</style></head><body><div class="app"><header class="top"><div class="logo">M</div><div class="brand"><b>MUTANT</b><span>GENERADOR INTERNO DE LICENCIAS</span></div></header><main class="main"><section class="panel"><h2>Nueva licencia</h2><div class="field"><label>Correo del cliente</label><input id="email" type="email" placeholder="cliente@correo.com" autocomplete="off"></div><div class="field"><label>Plan</label><select id="plan"><option value="">Cargando planes...</option></select></div><button class="generate" id="btn">GENERAR LICENCIA</button><div class="status" id="status"></div></section><section class="panel result"><div id="empty" class="empty">La licencia generada aparecerá aquí.</div><div id="out" hidden><h2>Licencia generada</h2><div class="key" id="key"></div><button class="copy" id="copy">COPIAR LICENCIA</button><div class="row"><div class="stat"><small>Programa</small><b id="oProgram">MUTANT</b></div><div class="stat"><small>Cliente</small><b id="oEmail"></b></div><div class="stat"><small>Plan</small><b id="oPlan"></b></div><div class="stat"><small>Perfiles</small><b id="oProfiles"></b></div><div class="stat"><small>Estado</small><b>ACTIVA</b></div><div class="stat"><small>Vence</small><b id="oExpiry"></b></div></div></div></section></main></div><script>const API='https://rnduuuiskfuikzuepvnw.supabase.co/functions/v1/mutant-license-api';const plansFallback=[['624ae7b7-ab3a-47f4-87b4-60a03c5fcf35','Especial 5',5],['75381f13-9a0f-4656-a278-7fe821540023','Básico 10',10],['f79fd60b-129e-4eac-902b-defc92a62952','Pro 35',35],['eda69b18-3df4-42da-9380-70cb64d5a0c6','Plus 50',50],['3f072c16-f414-458f-8b37-11a9c5e10fd7','Business 100',100],['4d14e7a4-413d-4de3-ab21-bb7b3f310046','Enterprise 500',500],['5b8295bf-e43d-48aa-b459-922e06bd2aa5','Max 1000',1000]];const $=id=>document.getElementById(id);function fill(a){$('plan').innerHTML='<option value="">Selecciona un plan</option>'+a.map(p=>`<option value="${p.id}">${p.name} — ${p.max_profiles} perfiles</option>`).join('')}async function load(){try{const r=await fetch(API+'/plans');const j=await r.json();if(j.ok&&j.plans?.length){fill(j.plans);return}}catch(e){}fill(plansFallback.map(x=>({id:x[0],name:x[1],max_profiles:x[2]})))}load();$('btn').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),plan=$('plan').value;if(!/^\S+@\S+\.\S+$/.test(email)){ $('status').textContent='Escribe un correo válido.';return}if(!plan){$('status').textContent='Selecciona un plan.';return}$('btn').disabled=true;$('btn').textContent='GENERANDO...';$('status').textContent='';try{const r=await fetch(API+'/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,plan_id:plan})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudo generar');const x=j.license||j;$('key').textContent=x.license_key||x.key||'';$('oEmail').textContent=j.client?.email||email;$('oPlan').textContent=j.plan?.name||$('plan').selectedOptions[0].textContent.split(' — ')[0];$('oProfiles').textContent=(j.plan?.max_profiles||x.max_profiles||'—')+' perfiles';$('oExpiry').textContent=x.expires_at?new Date(x.expires_at).toLocaleDateString('es-DO'): '—';$('empty').hidden=true;$('out').hidden=false;$('status').textContent='Licencia creada y registrada.'}catch(e){$('status').textContent=e.message||'Error generando licencia.'}finally{$('btn').disabled=false;$('btn').textContent='GENERAR LICENCIA'}};$('copy').onclick=()=>{navigator.clipboard.writeText($('key').textContent);$('copy').textContent='LICENCIA COPIADA ✓';setTimeout(()=>$('copy').textContent='COPIAR LICENCIA',1500)}</script></body></html>
