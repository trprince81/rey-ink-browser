<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutant — Generador de Licencias</title><style>:root{--g:#39ff88;--text:#f2fff7;--muted:#81958a;--line:#1c3b28}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent!important;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{background:transparent!important}.wrap{width:min(1050px,94vw);margin:22px auto 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.brandRow{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:1px solid #2c6b48;border-radius:13px;background:rgba(11,23,16,.35);display:grid;place-items:center;box-shadow:0 0 28px #39ff8818;backdrop-filter:blur(12px)}.logo svg{width:32px}.brand{font-size:27px;font-weight:950}.brand span{color:var(--g);text-shadow:0 0 18px #39ff8855}.sub{color:var(--muted);margin-top:3px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 300px auto;gap:10px;padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(8,12,10,.24);box-shadow:0 18px 45px #0003;backdrop-filter:blur(16px)}.input,.select{width:100%;background:rgba(7,11,9,.42);color:#fff;border:1px solid #294333;border-radius:10px;padding:12px;outline:none}.input:focus,.select:focus{border-color:var(--g);box-shadow:0 0 0 3px #39ff8814}.btn{border:1px solid #2b4b38;background:rgba(20,34,26,.58);color:#fff;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer;white-space:nowrap}.btn:hover{border-color:var(--g);box-shadow:0 0 18px #39ff8815}.btn:disabled{opacity:.55;cursor:wait}.status{margin:12px 0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:rgba(8,12,10,.22);backdrop-filter:blur(14px)}.result{display:none;margin-top:14px;padding:18px;border:1px solid #315b42;border-radius:17px;background:rgba(6,16,9,.55);backdrop-filter:blur(15px)}.result.open{display:block}.resultTitle{font-size:20px;font-weight:950}.key{margin:14px 0;padding:15px;border:1px solid #315b42;border-radius:12px;background:#050a07;color:var(--g);font-size:19px;font-weight:950;letter-spacing:1.4px;word-break:break-all}.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.row{padding:12px;border:1px solid #1d3025;border-radius:11px;background:rgba(8,12,10,.35)}.row span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.copy{margin-top:10px}.plans{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:13px}.plan{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(8,12,10,.22);text-align:center}.plan b{display:block;color:var(--g);font-size:13px}.plan span{display:block;color:var(--muted);font-size:11px;margin-top:3px}@media(max-width:900px){.toolbar{grid-template-columns:1fr}.plans{grid-template-columns:repeat(4,1fr)}.rows{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{width:calc(100% - 24px);margin:14px auto 30px}.head{align-items:flex-start}.brand{font-size:23px}.plans{grid-template-columns:repeat(2,1fr)}.rows{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div class="brandRow"><div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M8 50V14h9l15 20 15-20h9v36h-9V29L32 49 17 29v21H8Z" fill="#39ff88"/><path d="M25 14h14l-7-10-7 10Z" fill="#d9ffe9"/></svg></div><div><div class="brand">MUT<span>ANT</span></div><div class="sub">Generador de licencias · sin clave administrativa</div></div></div></header><div class="toolbar"><input id="email" class="input" type="email" autocomplete="email" placeholder="Correo del cliente"><select id="plan" class="select"><option value="">Cargando planes…</option></select><button class="btn" id="generate">⚡ GENERAR LICENCIA</button></div><div id="status" class="status">Preparando planes de Mutant…</div><section id="result" class="result"><div class="resultTitle">✓ Licencia generada</div><div id="key" class="key">—</div><button id="copy" class="btn copy">Copiar licencia</button><div class="rows"><div class="row"><span>Programa</span><b>Mutant</b></div><div class="row"><span>Correo</span><b id="rEmail">—</b></div><div class="row"><span>Plan</span><b id="rPlan">—</b></div><div class="row"><span>Perfiles</span><b id="rProfiles">—</b></div><div class="row"><span>Estado</span><b class="green">ACTIVA</b></div><div class="row"><span>Expira</span><b id="rExpires">—</b></div></div></section><div class="plans" id="plans"></div></main><script>const $=id=>document.getElementById(id),API='/api/license-generate.js';let plans=[];const prices={5:13,10:20,35:30,50:50,100:70,500:150,1000:350},names={5:'Especial',10:'Básico',35:'Pro',50:'Plus',100:'Business',500:'Enterprise',1000:'Max'};async function loadPlans(){try{const r=await fetch('/api/mutant-plans.js',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudieron cargar los planes');plans=(j.plans||[]).filter(p=>String(p.status).toLowerCase()==='active').sort((a,b)=>Number(a.max_profiles)-Number(b.max_profiles));$('plan').innerHTML='<option value="">Selecciona un plan</option>'+plans.map(p=>{const n=Number(p.max_profiles);return `<option value="${p.id}">${names[n]||p.name} · ${n.toLocaleString()} perfiles · $${prices[n]||p.price||'—'}/mes</option>`}).join('');$('plans').innerHTML=plans.map(p=>{const n=Number(p.max_profiles);return `<div class="plan"><b>${n.toLocaleString()} perfiles</b><span>$${prices[n]||p.price||'—'} / mes</span></div>`}).join('');$('status').textContent='✓ Mutant listo. Solo correo + plan.'}catch(e){$('status').textContent=e.message||'No se pudieron cargar los planes'}}async function generate(){const email=$('email').value.trim().toLowerCase(),plan_id=$('plan').value;if(!/^\S+@\S+\.\S+$/.test(email))return $('status').textContent='Escribe un correo válido.';if(!plan_id)return $('status').textContent='Selecciona un plan.';$('generate').disabled=true;$('status').textContent='Generando licencia…';$('result').classList.remove('open');try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,plan_id}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudo generar la licencia');$('key').textContent=j.license.key;$('rEmail').textContent=j.license.email;$('rPlan').textContent=j.license.plan_name||'—';$('rProfiles').textContent=Number(j.license.max_profiles).toLocaleString();$('rExpires').textContent=new Date(j.license.expires_at).toLocaleString();$('result').classList.add('open');$('status').textContent='✓ Licencia guardada y lista para usar en Mutant.'}catch(e){$('status').textContent=e.message||'Error del servidor'}finally{$('generate').disabled=false}}$('generate').onclick=generate;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('key').textContent);$('copy').textContent='✓ Copiada'}catch(_){prompt('Copia la licencia:',$('key').textContent)}};loadPlans();</script></body></html>
