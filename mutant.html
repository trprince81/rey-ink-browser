<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mutant — License Center</title>
<style>
:root{--bg:#050708;--panel:#0b0f0d;--panel2:#0f1512;--line:#1d3025;--green:#39ff88;--green2:#13c968;--text:#f2fff7;--muted:#7f9588;--red:#ff5577;--yellow:#ffd45c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0d4b2a44,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1400px,94vw);margin:25px auto 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{font-size:27px;font-weight:950;letter-spacing:1px}.brand span{color:var(--green);text-shadow:0 0 18px #39ff8855}.sub{color:var(--muted);margin-top:4px}.toolbar,.grid,.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{padding:14px;border:1px solid var(--line);border-radius:15px;background:#080c0a}.input,.select{background:#070b09;color:#fff;border:1px solid #294333;border-radius:10px;padding:11px 12px;min-width:180px;outline:none}.input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px #39ff8814}.btn{border:1px solid #2b4b38;background:linear-gradient(#14221a,#0d1611);color:#fff;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.btn:hover{border-color:var(--green);box-shadow:0 0 18px #39ff8815}.danger{color:#ff9aad;border-color:#673041;background:#271018}.green{color:var(--green);font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card{background:linear-gradient(145deg,#0c120f,#080c0a);border:1px solid var(--line);border-radius:15px;padding:16px}.k{font-size:10px;color:var(--muted);letter-spacing:1px}.v{font-size:27px;font-weight:950;margin-top:6px}.table{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#080c0a}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #18261e;vertical-align:middle}.table th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#0c120f}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;border:1px solid #294333;background:#101a14;padding:4px 8px;border-radius:999px;font-size:11px}.status{margin:12px 0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:#080c0a}.limitbox{display:flex;gap:5px;align-items:center}.limitbox input{width:85px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards{grid-template-columns:1fr}.input,.select{width:100%;min-width:0}.toolbar{display:grid}.table{display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><div class="brand">MUT<span>ANT</span></div><div class="sub">Centro de control de licencias y límites</div></div><div class="actions"><button class="btn" id="refresh">↻ Actualizar</button><button class="btn" id="back">← Rey Ink</button></div></header>
<div class="toolbar"><input id="adminKey" class="input" type="password" placeholder="Clave administrativa"><input id="email" class="input" placeholder="Correo del cliente"><input id="name" class="input" placeholder="Nombre del cliente"><select id="plan" class="select"><option value="">Selecciona un plan</option></select><button class="btn" id="create">＋ Crear licencia Mutant</button></div>
<div class="status" id="status">Introduce la clave administrativa para cargar Mutant.</div>
<section class="cards"><div class="card"><div class="k">LICENCIAS</div><div class="v" id="count">—</div></div><div class="card"><div class="k">ACTIVAS</div><div class="v" id="active">—</div></div><div class="card"><div class="k">PERFILES ASIGNADOS</div><div class="v" id="profiles">—</div></div><div class="card"><div class="k">SESIONES ASIGNADAS</div><div class="v" id="sessions">—</div></div></section>
<div id="table"><div class="empty">Esperando conexión…</div></div>
</main>
<script>
const API='/api/mutante-license-admin.js';let data={licenses:[],plans:[]};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]));
function headers(){return {'content-type':'application/json','x-admin-key':$('adminKey').value.trim()}}
async function call(body){const r=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify(body)});const j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!j.ok)throw Error(j.error||'Error');return j}
async function load(){const k=$('adminKey').value.trim();if(!k){$('status').textContent='Introduce la clave administrativa para cargar Mutant.';return}try{const r=await fetch(API+'?limit=100',{headers:{'x-admin-key':k}});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No autorizado');data=j;fillPlans();render();$('status').innerHTML='<span class="green">● Conectado</span> — Control Mutant listo.'}catch(e){$('status').textContent=e.message}}
function fillPlans(){const cur=$('plan').value;$('plan').innerHTML='<option value="">Selecciona un plan</option>'+data.plans.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${Number(p.max_profiles||0)} perfiles · ${Number(p.max_sessions||0)} sesiones</option>`).join('');if(cur)$('plan').value=cur}
function render(){const ls=data.licenses||[];$('count').textContent=ls.length;$('active').textContent=ls.filter(x=>x.status==='active').length;$('profiles').textContent=ls.reduce((a,x)=>a+Number(x.max_profiles||0),0).toLocaleString();$('sessions').textContent=ls.reduce((a,x)=>a+Number(x.max_sessions||0),0).toLocaleString();if(!ls.length){$('table').innerHTML='<div class="empty">No hay licencias Mutant todavía.</div>';return}$('table').innerHTML='<table class="table"><thead><tr><th>Cliente</th><th>Clave</th><th>Estado</th><th>Expira</th><th>Perfiles</th><th>Sesiones</th><th>Acciones</th></tr></thead><tbody>'+ls.map(l=>`<tr><td><b>${esc(l.client_name||'—')}</b><br><span style="color:var(--muted)">${esc(l.client_email||'')}</span></td><td><span class="badge">${esc(l.license_key)}</span></td><td>${l.status==='active'?'<span class="green">● Activa</span>':`<span style="color:var(--red)">● ${esc(l.status)}</span>`}</td><td>${l.expires_at?new Date(l.expires_at).toLocaleDateString():'—'}</td><td><div class="limitbox"><input id="p-${l.id}" class="input" type="number" min="1" max="1000000" value="${Number(l.max_profiles||1)}"><button class="btn mini" onclick="limits('${l.id}')">Guardar</button></div></td><td><div class="limitbox"><input id="s-${l.id}" class="input" type="number" min="1" max="100000" value="${Number(l.max_sessions||1)}"></div></td><td><button class="btn mini" onclick="renew('${l.id}')">+30 días</button> <button class="btn mini ${l.status==='active'?'danger':''}" onclick="toggle('${l.id}','${l.status==='active'?'paused':'active'}')">${l.status==='active'?'Pausar':'Activar'}</button></td></tr>`).join('')+'</tbody></table>'}
async function create(){try{if(!$('email').value.trim()||!$('plan').value)throw Error('Correo y plan son obligatorios');await call({action:'create',email:$('email').value,name:$('name').value,plan_id:$('plan').value});$('email').value='';$('name').value='';await load()}catch(e){alert(e.message)}}
async function limits(id){try{await call({action:'set_limits',id,max_profiles:$('p-'+id).value,max_sessions:$('s-'+id).value});await load()}catch(e){alert(e.message)}}
async function renew(id){try{await call({action:'renew',id,days:30});await load()}catch(e){alert(e.message)}}
async function toggle(id,status){try{await call({action:'status',id,status});await load()}catch(e){alert(e.message)}}
$('refresh').onclick=load;$('create').onclick=create;$('back').onclick=()=>location.href='/';$('adminKey').addEventListener('change',load);$('adminKey').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script></body></html>
