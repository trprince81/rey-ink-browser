<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutant — License Center</title><style>:root{--green:#39ff88;--text:#f2fff7;--muted:#7f9588;--red:#ff5577;--line:#1d3025}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent!important;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{background:transparent!important}.wrap{width:min(1400px,94vw);margin:22px auto 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.brandRow{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:1px solid #2c6b48;border-radius:13px;background:rgba(11,23,16,.35);display:grid;place-items:center;box-shadow:0 0 28px #39ff8818;backdrop-filter:blur(12px)}.logo svg{width:32px}.brand{font-size:27px;font-weight:950}.brand span{color:var(--green);text-shadow:0 0 18px #39ff8855}.sub{color:var(--muted);margin-top:3px}.actions,.toolbar,.rowActions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(8,12,10,.24);box-shadow:0 18px 45px #0003;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.input,.select{background:rgba(7,11,9,.28);color:#fff;border:1px solid #294333;border-radius:10px;padding:10px 12px;min-width:175px;outline:none}.input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px #39ff8814}.btn{border:1px solid #2b4b38;background:rgba(20,34,26,.48);color:#fff;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer;backdrop-filter:blur(10px)}.btn:hover{border-color:var(--green);box-shadow:0 0 18px #39ff8815}.danger{color:#ff9aad;border-color:#673041;background:rgba(39,16,24,.55)}.green{color:var(--green);font-weight:900}.status{margin:12px 0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:rgba(8,12,10,.22);backdrop-filter:blur(14px)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.card{background:rgba(12,18,15,.25);border:1px solid var(--line);border-radius:15px;padding:15px;backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px)}.k{font-size:10px;color:var(--muted);letter-spacing:1px}.v{font-size:25px;font-weight:950;margin-top:5px}.table{width:100%;border-collapse:separate;border-spacing:0;margin-top:13px;border:1px solid var(--line);border-radius:15px;background:rgba(8,12,10,.22);overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #18261e;vertical-align:middle}.table th{font-size:10px;text-transform:uppercase;color:var(--muted);background:rgba(12,18,15,.28)}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;border:1px solid #294333;background:rgba(16,26,20,.35);padding:4px 8px;border-radius:999px;font-size:11px}.limitbox{display:flex;gap:5px;align-items:center}.limitbox input{width:82px}.mini{padding:7px 9px;font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted)}.copy{cursor:pointer}.notice{font-size:12px;color:var(--muted);margin-top:7px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalBox{width:min(480px,96vw);padding:22px;border:1px solid #315b42;border-radius:18px;background:#09100c;box-shadow:0 30px 100px #000}.licenseKey{font-size:19px;letter-spacing:1.5px;color:var(--green);padding:15px;border:1px solid #315b42;border-radius:12px;background:#050a07;word-break:break-all;margin:15px 0}.modalActions{display:flex;gap:8px;justify-content:flex-end}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.toolbar{display:grid}.input,.select{width:100%;min-width:0}}@media(max-width:500px){.cards{grid-template-columns:1fr}.head{align-items:flex-start}.actions{justify-content:flex-end}.brand{font-size:23px}}</style></head><body><main class="wrap"><header class="head"><div class="brandRow"><div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M8 50V14h9l15 20 15-20h9v36h-9V29L32 49 17 29v21H8Z" fill="#39ff88"/><path d="M25 14h14l-7 10-7-10Z" fill="#d9ffe9"/></svg></div><div><div class="brand">MUT<span>ANT</span></div><div class="sub">Centro de control de licencias, clientes y límites</div></div></div><div class="actions"><button class="btn" id="refresh">↻ Actualizar</button><button class="btn" id="logout">Cerrar sesión</button><button class="btn" id="back">← Rey Ink</button></div></header><div class="toolbar"><input id="adminKey" class="input" type="password" placeholder="Clave administrativa"><input id="email" class="input" placeholder="Correo del cliente"><input id="name" class="input" placeholder="Nombre del cliente"><select id="plan" class="select"><option value="">Selecciona un plan</option></select><button class="btn" id="create">＋ Crear cliente + licencia</button></div><div class="notice" id="sessionNotice">Sesión administrativa local del navegador.</div><div class="status" id="status">Validando sesión…</div><section class="cards"><div class="card"><div class="k">CLIENTES</div><div class="v" id="clients">—</div></div><div class="card"><div class="k">LICENCIAS</div><div class="v" id="count">—</div></div><div class="card"><div class="k">ACTIVAS</div><div class="v" id="active">—</div></div><div class="card"><div class="k">PERFILES</div><div class="v" id="profiles">—</div></div><div class="card"><div class="k">SESIONES</div><div class="v" id="sessions">—</div></div></section><div id="table"><div class="empty">Esperando conexión…</div></div></main><div class="modal" id="modal"><div class="modalBox"><h3>Licencia Mutant creada</h3><p>Cliente creado correctamente. Guarda esta licencia.</p><div class="licenseKey" id="newKey">—</div><div class="modalActions"><button class="btn" id="copy">Copiar licencia</button><button class="btn" id="closeModal">Cerrar</button></div></div></div><script>
const API='/api/mutante-license-admin.js',STORE='reyInkMutantAdminKey';let data={licenses:[],plans:[]};const PRICES={5:13,10:20,35:30,50:50,100:70,500:150,1000:350},NAMES={5:'Especial',10:'Básico',35:'Pro',50:'Plus',100:'Business',500:'Enterprise',1000:'Max'};const FALLBACK_PLANS={'Especial 5':{id:'624ae7b7-ab3a-47f4-87b4-60a03c5fcf35',max_profiles:5},'Básico 10':{id:'75381f13-9a0f-4656-a278-7fe821540023',max_profiles:10},'Pro 35':{id:'f79fd60b-129e-4eac-902b-defc92a62952',max_profiles:35},'Plus 50':{id:'eda69b18-3df4-42da-9380-70cb64d5a0c6',max_profiles:50},'Business 100':{id:'3f072c16-f414-458f-8b37-11a9c5e10fd7',max_profiles:100},'Enterprise 500':{id:'4d14e7a4-413d-4de3-ab21-bb7b3f310046',max_profiles:500},'Max 1000':{id:'5b8295bf-e43d-48aa-b459-922e06bd2aa5',max_profiles:1000}};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function headers(){return {'content-type':'application/json','x-admin-key':$('adminKey').value.trim()}}function saveKey(){const k=$('adminKey').value.trim();if(k)localStorage.setItem(STORE,k)}function hideKey(){const i=$('adminKey');if(i.value){i.style.display='none';$('sessionNotice').textContent='✓ Sesión administrativa activa en este navegador. Usa “Cerrar sesión” para cambiar la clave.'}}function clearKey(){localStorage.removeItem(STORE);$('adminKey').value='';$('adminKey').style.display='';data={licenses:[],plans:[]};fillPlans();render();$('status').textContent='Sesión cerrada. Introduce la clave administrativa.';$('sessionNotice').textContent='Sesión administrativa local del navegador.'}async function call(body){saveKey();const r=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!j.ok)throw Error(j.error||'Error del servidor');return j}async function load(){const k=$('adminKey').value.trim();if(!k){$('status').textContent='Introduce la clave administrativa para cargar Mutant.';return}saveKey();try{const r=await fetch(API+'?limit=100',{headers:{'x-admin-key':k},cache:'no-store'}),j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!j.ok)throw Error(j.error||'No autorizado');data=j;fillPlans();render();hideKey();$('status').innerHTML='<span class="green">● Conectado</span> — Control Mutant listo.'}catch(e){$('status').textContent=e.message||'No se pudo conectar'}}function fillPlans(){const cur=$('plan').value,seen=new Set();let source=(data.plans||[]).filter(p=>Number(p.duration_days)===30&&PRICES[Number(p.max_profiles)]&&String(p.status||'').toLowerCase()==='active');if(!source.length)source=Object.entries(FALLBACK_PLANS).map(([name,p])=>({id:p.id,name,max_profiles:p.max_profiles,max_sessions:1,duration_days:30,status:'active'}));source=source.filter(p=>{const n=Number(p.max_profiles);if(seen.has(n))return false;seen.add(n);return true}).sort((a,b)=>Number(a.max_profiles)-Number(b.max_profiles));$('plan').innerHTML='<option value="">Selecciona un plan</option>'+source.map(p=>{const n=Number(p.max_profiles);return `<option value="${esc(p.id)}">${NAMES[n]||esc(p.name)} · ${n.toLocaleString()} perfiles · $${PRICES[n]}/mes</option>`}).join('');if(cur&&[...$('plan').options].some(o=>o.value===cur))$('plan').value=cur}function render(){const ls=data.licenses||[],clients=new Set(ls.map(x=>String(x.client_email||'').toLowerCase()).filter(Boolean));$('clients').textContent=clients.size;$('count').textContent=ls.length;$('active').textContent=ls.filter(x=>x.status==='active').length;$('profiles').textContent=ls.reduce((a,x)=>a+Number(x.max_profiles||0),0).toLocaleString();$('sessions').textContent=ls.reduce((a,x)=>a+Number(x.max_sessions||0),0).toLocaleString();if(!ls.length){$('table').innerHTML='<div class="empty">No hay licencias Mutant todavía.</div>';return}$('table').innerHTML='<table class="table"><thead><tr><th>Cliente</th><th>Licencia</th><th>Estado</th><th>Expira</th><th>Perfiles</th><th>Sesiones</th><th>Acciones</th></tr></thead><tbody>'+ls.map(l=>`<tr><td><b>${esc(l.client_name||'—')}</b><br><span style="color:var(--muted)">${esc(l.client_email||'')}</span></td><td><span class="badge" data-copy="${esc(l.license_key)}">${esc(l.license_key)}</span></td><td>${l.status==='active'?'<span class="green">● Activa</span>':`<span style="color:var(--red)">● ${esc(l.status)}</span>`}</td><td>${l.expires_at?new Date(l.expires_at).toLocaleDateString():'—'}</td><td><div class="limitbox"><input id="p-${l.id}" class="input" type="number" min="1" value="${Number(l.max_profiles||1)}"><button class="btn mini" onclick="limits('${l.id}')">Guardar</button></div></td><td><input id="s-${l.id}" class="input" type="number" min="1" value="${Number(l.max_sessions||1)}"></td><td><div class="rowActions"><button class="btn mini" onclick="renew('${l.id}')">+30 días</button><button class="btn mini ${l.status==='active'?'danger':''}" onclick="toggle('${l.id}','${l.status==='active'?'paused':'active'}')">${l.status==='active'?'Pausar':'Activar'}</button>${l.status!=='revoked'?`<button class="btn mini danger" onclick="toggle('${l.id}','revoked')">Revocar</button>`:''}</div></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=()=>copyText(el.dataset.copy))}async function create(){try{const email=$('email').value.trim();if(!email||!$('plan').value)throw Error('Correo y plan son obligatorios');const x=await call({action:'create',email,name:$('name').value,plan_id:$('plan').value});$('email').value='';$('name').value='';$('newKey').textContent=x.license?.license_key||'—';$('modal').classList.add('open');await load()}catch(e){alert(e.message)}}async function limits(id){try{await call({action:'set_limits',id,max_profiles:$('p-'+id).value,max_sessions:$('s-'+id).value});await load()}catch(e){alert(e.message)}}async function renew(id){try{await call({action:'renew',id,days:30});await load()}catch(e){alert(e.message)}}async function toggle(id,status){try{await call({action:'status',id,status});await load()}catch(e){alert(e.message)}}async function copyText(t){try{await navigator.clipboard.writeText(t);$('status').textContent='✓ Copiado.'}catch(_){prompt('Copia la licencia:',t)}}$('refresh').onclick=load;$('create').onclick=create;$('logout').onclick=clearKey;$('back').onclick=()=>location.href='/';$('closeModal').onclick=()=>$('modal').classList.remove('open');$('copy').onclick=()=>copyText($('newKey').textContent);const stored=localStorage.getItem(STORE);if(stored){$('adminKey').value=stored;load()}else fillPlans();</script></body></html>
