<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUTANT — Generador de Licencias</title><style>:root{--g:#39ff88;--text:#f2fff7;--muted:#81958a;--line:#1c3b28}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent!important;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}body{background:transparent!important}.wrap{width:min(1050px,94vw);margin:18px auto 50px}.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{width:64px;height:64px;border:1px solid #2c6b48;border-radius:15px;background:#050b07;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 30px #39ff8830}.logo img{width:100%;height:100%;object-fit:cover}.brand{font-size:28px;font-weight:950;letter-spacing:.5px}.brand span{color:var(--g);text-shadow:0 0 18px #39ff8855}.sub{color:var(--muted);margin-top:3px}.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(6,14,9,.42);box-shadow:0 18px 55px #0005;backdrop-filter:blur(16px)}h1{margin:0 0 7px;font-size:25px}.desc{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:18px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 330px auto;gap:10px}.input,.select{width:100%;background:rgba(4,10,7,.72);color:#fff;border:1px solid #294333;border-radius:11px;padding:13px;outline:none;font-size:15px}.input:focus,.select:focus{border-color:var(--g);box-shadow:0 0 0 3px #39ff8814}.btn{border:1px solid #39b86d;background:rgba(19,53,32,.72);color:#fff;border-radius:11px;padding:12px 16px;font-weight:950;cursor:pointer;white-space:nowrap}.btn:hover{border-color:var(--g);box-shadow:0 0 22px #39ff8825}.btn:disabled{opacity:.55;cursor:wait}.status{margin:13px 0 0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;color:var(--muted);background:rgba(8,12,10,.22)}.result{display:none;margin-top:15px;padding:18px;border:1px solid #315b42;border-radius:17px;background:rgba(5,17,9,.72)}.result.open{display:block}.resultTitle{font-size:20px;font-weight:950}.key{margin:13px 0;padding:15px;border:1px solid #315b42;border-radius:12px;background:#030805;color:var(--g);font-size:19px;font-weight:950;letter-spacing:1.4px;word-break:break-all}.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.row{padding:11px;border:1px solid #1d3025;border-radius:11px;background:rgba(8,12,10,.35)}.row span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.copy{margin-top:9px}.plans{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:13px}.plan{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(8,12,10,.22);text-align:center}.plan b{display:block;color:var(--g);font-size:13px}.plan span{display:block;color:var(--muted);font-size:11px;margin-top:3px}@media(max-width:900px){.toolbar{grid-template-columns:1fr}.plans{grid-template-columns:repeat(4,1fr)}.rows{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{width:calc(100% - 24px);margin:12px auto 28px}.logo{width:58px;height:58px}.brand{font-size:23px}.card{padding:17px}.plans{grid-template-columns:repeat(2,1fr)}.rows{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div class="logo"><img alt="MUTANT" src="data:image/webp;base64,"+logo64+""/></div><div><div class="brand">MUT<span>ANT</span></div><div class="sub">Generador oficial de licencias</div></div></header><section class="card"><h1>Nueva licencia</h1><div class="desc">Escribe el correo, elige el plan y genera. No necesitas ninguna clave administrativa.</div><div class="toolbar"><input id="email" class="input" type="email" autocomplete="email" placeholder="Correo del cliente"><select id="plan" class="select"><option value="">Cargando planes…</option></select><button class="btn" id="generate">⚡ GENERAR LICENCIA</button></div><div id="status" class="status">Cargando planes de Mutant…</div><section id="result" class="result"><div class="resultTitle">✓ Licencia generada</div><div id="key" class="key">—</div><button id="copy" class="btn copy">Copiar licencia</button><div class="rows"><div class="row"><span>Programa</span><b>MUTANT</b></div><div class="row"><span>Correo</span><b id="rEmail">—</b></div><div class="row"><span>Plan</span><b id="rPlan">—</b></div><div class="row"><span>Perfiles</span><b id="rProfiles">—</b></div><div class="row"><span>Estado</span><b>ACTIVA</b></div><div class="row"><span>Expira</span><b id="rExpires">—</b></div></div></section><div class="plans" id="plans"></div></section></main><script>const $=id=>document.getElementById(id),API='/api/license-generate.js';let plans=[];const prices={5:13,10:20,35:30,50:50,100:70,500:150,1000:350},names={5:'Especial',10:'Básico',35:'Pro',50:'Plus',100:'Business',500:'Enterprise',1000:'Max'};async function loadPlans(){try{const r=await fetch('/api/mutant-plans.js',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudieron cargar los planes');plans=(j.plans||[]).filter(p=>String(p.status).toLowerCase()==='active').sort((a,b)=>Number(a.max_profiles)-Number(b.max_profiles));if(!plans.length)throw Error('No hay planes activos');$('plan').innerHTML='<option value="">Selecciona un plan</option>'+plans.map(p=>{const n=Number(p.max_profiles);return `<option value="${p.id}">${names[n]||p.name} · ${n.toLocaleString()} perfiles · $${prices[n]||p.price||'—'}/mes</option>`}).join('');$('plans').innerHTML=plans.map(p=>{const n=Number(p.max_profiles);return `<div class="plan"><b>${n.toLocaleString()} perfiles</b><span>$${prices[n]||p.price||'—'} / mes</span></div>`}).join('');$('status').textContent='✓ Mutant listo. Solo correo + plan.'}catch(e){$('status').textContent='⚠ '+(e.message||'No se pudieron cargar los planes')}}async function generate(){const email=$('email').value.trim().toLowerCase(),plan_id=$('plan').value;if(!/^\S+@\S+\.\S+$/.test(email))return $('status').textContent='Escribe un correo válido.';if(!plan_id)return $('status').textContent='Selecciona un plan.';$('generate').disabled=true;$('status').textContent='Generando licencia…';$('result').classList.remove('open');try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,plan_id}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudo generar la licencia');$('key').textContent=j.license.key;$('rEmail').textContent=j.license.email;$('rPlan').textContent=j.license.plan_name||'—';$('rProfiles').textContent=Number(j.license.max_profiles).toLocaleString();$('rExpires').textContent=new Date(j.license.expires_at).toLocaleString();$('result').classList.add('open');$('status').textContent='✓ Licencia guardada y lista para usar en Mutant.'}catch(e){$('status').textContent='⚠ '+(e.message||'Error del servidor')}finally{$('generate').disabled=false}}$('generate').onclick=generate;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('key').textContent);$('copy').textContent='✓ Copiada'}catch(_){prompt('Copia la licencia:',$('key').textContent)}};loadPlans();</script></body></html>
