<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutante — Licencias</title><style>:root{--bg:#050807;--panel:#0b110d;--line:#19351f;--green:#35ff78;--muted:#7e9b85;--red:#ff5f6d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#0c5a2730,transparent 35%),var(--bg);color:#f4fff6;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1400px,94vw);margin:28px auto 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:27px;font-weight:950;letter-spacing:1px}.brand span{color:var(--green)}.sub{color:var(--muted);margin-top:4px}.btn,input,select{border:1px solid var(--line);border-radius:10px;background:#08100a;color:#fff;padding:10px 12px}.btn{cursor:pointer;font-weight:800}.btn.primary{background:#0d5425;border-color:#22c95a}.btn.danger{color:#ff9aa2;border-color:#5b222a}.panel{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#0a100c,#070b08)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{min-width:260px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:25px;margin-top:5px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #142319}th{font-size:10px;color:var(--muted);text-transform:uppercase}.ok{color:var(--green);font-weight:900}.bad{color:#ff8d98;font-weight:900}.actions{display:flex;gap:5px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{width:min(470px,100%);padding:22px;border:1px solid #255d32;border-radius:18px;background:#08100a;box-shadow:0 20px 80px #000}.box h2{margin-top:0}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%}.key{font-family:ui-monospace,monospace;color:var(--green);letter-spacing:1px}.notice{padding:11px;border-radius:10px;background:#0c1a10;color:var(--muted);margin-top:12px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:520px){.stats{grid-template-columns:1fr}.toolbar input{min-width:0;width:100%}}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">MUT<span>ANTE</span> <small>LICENSE CENTER</small></div><div class="sub">Administra tus 100 licencias, keys y vencimientos desde un solo lugar.</div></div><button class="btn danger" id="logout">Cerrar sesión</button></header><section class="panel"><div class="toolbar"><input id="adminKey" type="password" placeholder="REY_INK_ADMIN_KEY"><button class="btn primary" id="saveKey">Conectar</button><button class="btn" id="newBtn">+ Nueva licencia</button><button class="btn" id="refresh">Actualizar</button></div><div id="msg" class="notice">Introduce tu clave administrativa para cargar el centro.</div><div class="stats"><div class="stat"><span class="muted">Total</span><b id="total">0</b></div><div class="stat"><span class="muted">Activas</span><b id="active">0</b></div><div class="stat"><span class="muted">Vencidas</span><b id="expired">0</b></div><div class="stat"><span class="muted">Disponibles</span><b id="slots">100</b></div></div><input id="search" placeholder="Buscar por correo, cliente o key..." style="width:100%"><table><thead><tr><th>Cliente</th><th>Correo</th><th>Key</th><th>Estado</th><th>Vence</th><th>Acciones</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">Sin datos.</td></tr></tbody></table></section></main><div class="modal" id="modal"><div class="box"><h2>Nueva licencia Mutante</h2><div class="field"><label>Correo del cliente</label><input id="email" type="email" placeholder="cliente@correo.com"></div><div class="field"><label>Nombre</label><input id="name" placeholder="Nombre del cliente"></div><div class="field"><label>Plan</label><select id="plan"></select></div><div class="actions"><button class="btn primary" id="create">Generar key</button><button class="btn" id="cancel">Cancelar</button></div><div id="created" class="notice" style="display:none"></div></div></div><script>let licenses=[],plans=[];const $=id=>document.getElementById(id);const api='/api/mutante-license-admin';function admin(){return localStorage.getItem('mutante_admin_key')||$('adminKey').value.trim()}function headers(){return {'content-type':'application/json','x-admin-key':admin()}}async function load(){if(!admin()){return}$('msg').textContent='Cargando...';const r=await fetch(api,{headers:headers()});const d=await r.json();if(!r.ok||!d.ok){$('msg').textContent=d.error||'No autorizado';return}licenses=d.licenses||[];plans=d.plans||[];localStorage.setItem('mutante_admin_key',admin());$('adminKey').value=admin();render();$('msg').textContent='Centro conectado.'}function render(){const q=$('search').value.toLowerCase();const list=licenses.filter(x=>(x.client_name+' '+(x.client_email||'')+' '+x.license_key).toLowerCase().includes(q));$('total').textContent=licenses.length;$('active').textContent=licenses.filter(x=>x.status==='active'&&x.expires_at&&new Date(x.expires_at)>new Date()).length;$('expired').textContent=licenses.filter(x=>x.status==='expired'||(x.expires_at&&new Date(x.expires_at)<=new Date())).length;$('slots').textContent=Math.max(0,100-licenses.length);$('rows').innerHTML=list.map(x=>{const exp=x.expires_at?new Date(x.expires_at).toLocaleDateString('es-DO'):'—';const good=x.status==='active'&&x.expires_at&&new Date(x.expires_at)>new Date();return `<tr><td>${esc(x.client_name||'—')}</td><td>${esc(x.client_email||'—')}</td><td class="key">${esc(x.license_key)}</td><td class="${good?'ok':'bad'}">${esc(x.status)}</td><td>${exp}</td><td><div class="actions"><button class="btn" onclick="renew('${x.id}')">+1 mes</button><button class="btn" onclick="renew('${x.id}',90)">+3 meses</button><button class="btn" onclick="toggle('${x.id}','${good?'paused':'active'}')">${good?'Pausar':'Activar'}</button><button class="btn" onclick="copyKey('${x.license_key}')">Copiar key</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No hay coincidencias.</td></tr>';$('plan').innerHTML=plans.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.duration_days} días</option>`).join('')}function esc(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}async function post(data){const r=await fetch(api,{method:'POST',headers:headers(),body:JSON.stringify(data)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Error');return d}async function renew(id,days=30){try{await post({action:'renew',id,days});await load()}catch(e){alert(e.message)}}async function toggle(id,status){try{await post({action:'status',id,status});await load()}catch(e){alert(e.message)}}async function copyKey(k){await navigator.clipboard.writeText(k);$('msg').textContent='Key copiada: '+k}$('saveKey').onclick=load;$('refresh').onclick=load;$('search').oninput=render;$('logout').onclick=()=>{localStorage.removeItem('mutante_admin_key');$('adminKey').value='';$('msg').textContent='Sesión cerrada.'};$('newBtn').onclick=()=>{$('modal').classList.add('open');$('created').style.display='none'};$('cancel').onclick=()=>$('modal').classList.remove('open');$('create').onclick=async()=>{try{const d=await post({action:'create',email:$('email').value,name:$('name').value,plan_id:$('plan').value});$('created').style.display='block';$('created').innerHTML='Licencia creada: <b class="key">'+esc(d.license.license_key)+'</b><br>Correo: '+esc(d.license.client_email)+'<br>Vence: '+new Date(d.license.expires_at).toLocaleString('es-DO');$('email').value='';$('name').value='';await load()}catch(e){$('created').style.display='block';$('created').textContent=e.message}};load();</script></body></html>
